<style>
/* =========================================================================
   AFP-VLUNA — Medical Military theme
   Palette: olive drab / khaki (military) + clinical teal & white (medical)
   ========================================================================= */
:root{
  --olive-950:#1b2313;
  --olive-900:#242f19;
  --olive-800:#33421f;
  --olive-700:#455a28;
  --olive-600:#5a7332;
  --khaki-100:#f4f1e6;
  --khaki-200:#e9e3cd;
  --khaki-300:#d8cfa7;
  --teal-700:#0e5f5c;
  --teal-600:#12796f;
  --teal-500:#189985;
  --accent-red:#8a1f1f;
  --accent-amber:#a5680f;
  --white:#ffffff;
  --ink-900:#181d14;
  --ink-600:#4b5240;
  --ink-400:#7b8270;
  --border:#cfc6a3;
  --card-shadow:0 1px 2px rgba(24,29,20,.06), 0 4px 14px rgba(24,29,20,.06);
  --radius:10px;

  --status-admitted:#1b5e20;
  --status-discharged:#0d47a1;
  --status-deceased:#5c5c5c;
  --status-nonadmitted:#a5680f;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:var(--khaki-100);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; font-size:14px; }
a{ color:var(--teal-700); }

/* ---------- App shell ---------- */
#app-shell{ display:flex; min-height:100vh; }

.sidebar{
  width:250px; flex-shrink:0;
  background:linear-gradient(180deg, var(--olive-950), var(--olive-900) 60%, var(--olive-800));
  color:var(--khaki-100);
  display:flex; flex-direction:column;
  transition:width .18s ease;
  position:relative;
  z-index:20;
}
.sidebar.collapsed{ width:64px; }
.sidebar-brand{
  display:flex; align-items:center; gap:10px;
  padding:18px 16px; border-bottom:1px solid rgba(244,241,230,.12);
  white-space:nowrap; overflow:hidden;
}
.sidebar-brand .crest{
  width:34px;height:34px;border-radius:50%;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800; color:#fff; font-size:13px; flex-shrink:0;
  border:2px solid var(--khaki-300);
  overflow:hidden;
}
.sidebar-brand .crest img{ width:100%; height:100%; object-fit:cover; }
.sidebar-brand .brand-text{ line-height:1.15; }
.sidebar-brand .brand-text b{ font-size:14px; display:block; letter-spacing:.4px;}
.sidebar-brand .brand-text span{ font-size:11px; color:var(--khaki-300); }
.sidebar.collapsed .brand-text{ display:none; }

.sidebar-toggle{
  background:none;border:none;color:var(--khaki-200);cursor:pointer;
  padding:14px 16px; text-align:left; font-size:13px; opacity:.8;
}
.sidebar-toggle:hover{opacity:1;}

.nav-list{ list-style:none; margin:0; padding:6px 8px; overflow-y:auto; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; margin:2px 0; border-radius:8px;
  color:var(--khaki-200); cursor:pointer; white-space:nowrap; overflow:hidden;
  font-size:13.5px; font-weight:500;
}
.nav-item .icon{ width:20px; text-align:center; flex-shrink:0; font-size:15px; }
.nav-item:hover{ background:rgba(244,241,230,.08); color:#fff; }
.nav-item.active{ background:var(--teal-700); color:#fff; }
.sidebar.collapsed .nav-item span.label{ display:none; }

.sidebar-foot{ padding:12px 16px; font-size:10.5px; color:var(--khaki-300); border-top:1px solid rgba(244,241,230,.12); }

/* ---------- Main column ---------- */
.main-col{ flex:1; display:flex; flex-direction:column; min-width:0; }

.topbar{
  height:58px; background:var(--white); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; position:sticky; top:0; z-index:10;
}
.topbar-left{ display:flex; align-items:center; gap:14px; }
.topbar-title{ font-size:16px; font-weight:700; color:var(--olive-900); }
.topbar-right{ display:flex; align-items:center; gap:10px; }
.demo-badge{
  background:var(--accent-amber); color:#fff; font-size:10.5px; font-weight:700;
  padding:3px 8px; border-radius:20px; letter-spacing:.5px;
}
.icon-btn{
  background:var(--khaki-200); border:1px solid var(--border); color:var(--olive-900);
  border-radius:8px; padding:7px 10px; cursor:pointer; font-size:13px; display:flex; gap:6px; align-items:center;
}
.icon-btn:hover{ background:var(--khaki-300); }
.user-chip{
  display:flex; align-items:center; gap:8px; background:var(--khaki-200);
  border:1px solid var(--border); border-radius:20px; padding:4px 12px 4px 4px; cursor:pointer;
}
.user-avatar{
  width:28px;height:28px;border-radius:50%; background:var(--teal-600); color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.user-chip .u-name{ font-size:12.5px; font-weight:600; color:var(--olive-900); }
.user-chip .u-role{ font-size:10.5px; color:var(--ink-600); display:block; }

.view-container{ padding:20px 24px 60px; flex:1; }

/* ---------- Cards / layout helpers ---------- */
.card{
  background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--card-shadow); padding:16px;
}
.card + .card{ margin-top:16px; }
.section-title{
  font-size:15px; font-weight:700; color:var(--olive-900);
  margin:0 0 12px; display:flex; align-items:center; gap:8px;
}
.section-title .tag{ font-size:10px; font-weight:700; background:var(--olive-700); color:#fff; padding:2px 7px; border-radius:5px; }

.grid{ display:grid; gap:14px; }
.grid.cols-2{ grid-template-columns:repeat(2,1fr); }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:1100px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }

.stat-card{
  background:linear-gradient(160deg,#fff,var(--khaki-100)); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px; box-shadow:var(--card-shadow);
}
.stat-card .stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-600); font-weight:700; }
.stat-card .stat-value{ font-size:26px; font-weight:800; color:var(--olive-900); margin-top:4px; }
.stat-card .stat-sub{ font-size:11.5px; color:var(--ink-400); margin-top:2px; }
.stat-card.accent-teal{ border-left:4px solid var(--teal-600); }
.stat-card.accent-red{ border-left:4px solid var(--accent-red); }
.stat-card.accent-amber{ border-left:4px solid var(--accent-amber); }
.stat-card.accent-olive{ border-left:4px solid var(--olive-700); }

/* ---------- Forms ---------- */
.form-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px 14px; }
@media (max-width:900px){ .form-grid{ grid-template-columns:repeat(2,1fr);} }
.field{ display:flex; flex-direction:column; gap:5px; }
.field.span-2{ grid-column:span 2; }
.field.span-3{ grid-column:span 3; }
.field label{ font-size:11.5px; font-weight:700; color:var(--ink-600); text-transform:uppercase; letter-spacing:.3px; }
.field input, .field select, .field textarea{
  border:1px solid var(--border); border-radius:7px; padding:8px 10px;
  background:#fff; color:var(--ink-900);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--teal-500); outline-offset:0; border-color:var(--teal-500); }
.field .hint{ font-size:10.5px; color:var(--ink-400); font-weight:400; text-transform:none; }

.btn{
  border:none; border-radius:8px; padding:9px 16px; font-weight:700; font-size:13px;
  cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.btn-primary{ background:var(--teal-700); color:#fff; }
.btn-primary:hover{ background:var(--teal-600); }

.badge.st-discharged{ background:var(--status-discharged); }
.badge.st-deceased{ background:var(--status-deceased); }
.badge.st-nonadmitted{ background:var(--status-nonadmitted); }

  background:none; border:none; padding:9px 14px; font-weight:700; font-size:12.5px;

  .sidebar-scrim{

  .sidebar-mobile-toggle{
    display:flex; align-items:center; justify-content:center;

  }

  .topbar{ padding:0 10px; height:54px; gap:8px; }
  .topbar-title{ font-size:14px; }
  .demo-badge{ display:none; } /* saves space on small screens */
  .user-chip .u-name, .user-chip .u-role{ display:none; }
  .user-chip{ padding:6px; }
  .icon-btn span.label{ display:none; }

  .view-container{ padding:12px 10px 40px; }

  .grid.cols-2, .grid.cols-3, .grid.cols-4{ grid-template-columns:1fr; }
  .form-grid{ grid-template-columns:1fr; }
  .field.span-2, .field.span-3{ grid-column:span 1; }

  .card{ padding:12px; }
  .stat-card .stat-value{ font-size:22px; }

  /* Tables scroll horizontally instead of squeezing/breaking layout */
  [id$="TableWrap"], .data-table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.data-table{ min-width:640px; }
  table.data-table th, table.data-table td{ padding:8px 8px; font-size:12.5px; }

  .modal-backdrop{ padding:0; align-items:stretch; }
  .modal{ max-width:100%; width:100%; min-height:100vh; border-radius:0; display:flex; flex-direction:column; }
  .modal-body{ max-height:none; flex:1; }
  .modal-header{ padding:14px 16px; }
  .modal-footer{ flex-wrap:wrap; padding:12px 16px; }

  .tabbar{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; }
  .tabbar button{ flex-shrink:0; }

  .login-card{ padding:24px 18px; }

  .chart-box, .chart-box.small{ height:220px; }
}

/**

 * AFP security requirements):

 *   where a portable option existed, so it maps cleanly to Oracle

 *   TIMESTAMP WITH TIME ZONE). Only db.js's "supabase" branch needs to be

 *   client — module code (cases.js, opd.js, etc.) never changes.
 * -----------------------------------------------------------------------

/** Format any Date/ISO-string as Philippine local time. */
function fmtPH(dateInput, opts = {}) {
  if (!dateInput) return "";
  const d = new Date(dateInput);
  if (isNaN(d)) return "";
  return new Intl.DateTimeFormat("en-PH", {
    timeZone: APP_CONFIG.TIMEZONE,
    year: "numeric", month: "short", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
    ...opts
  }).format(d);
}

function fmtPHDate(dateInput) {
  if (!dateInput) return "";
  const d = new Date(dateInput);
  if (isNaN(d)) return "";
  return new Intl.DateTimeFormat("en-PH", {
    timeZone: APP_CONFIG.TIMEZONE, year: "numeric", month: "short", day: "2-digit"
  }).format(d);
}

/** ISO timestamp stamped "now" — stored in UTC, always rendered back in PH time. */
function nowISO() { return new Date().toISOString(); }

/** Age from a birthdate string, computed as of today (PH calendar day). */
function computeAge(birthdateStr) {
  if (!birthdateStr) return "";
  const today = new Date();
  const bd = new Date(birthdateStr);
  if (isNaN(bd)) return "";
  let age = today.getFullYear() - bd.getFullYear();
  const m = today.getMonth() - bd.getMonth();
  if (m < 0 || (m === 0 && today.getDate() < bd.getDate())) age--;
  return age;
}

/** Hospital days between admission and discharge (inclusive counting per spec). */
function computeHospitalDays(admissionDate, dischargeDate) {
  if (!admissionDate || !dischargeDate) return "";
  const a = new Date(admissionDate), d = new Date(dischargeDate);
  if (isNaN(a) || isNaN(d)) return "";
  const diff = Math.round((d - a) / 86400000);
  return diff < 0 ? "" : diff;
}

/**
 * db.js
 * -----------------------------------------------------------------------
 * ALL data access for the whole app goes through the DB object below.
 * No module (users.js, cases.js, opd.js, ...) touches localStorage or
 * Supabase directly — this is the ONE seam to change when migrating.
 *
 * Tables (mirrors /supabase/schema.sql):
 *   users, patients, cases, opd_visits, directory, tasks,
 *   activity_logs, legends
 *
 * Every write goes through DB.insert/update/remove, which also appends
 * an activity_logs row — so Activity Logs and the "recent activity"
 * widgets on every module are automatically populated, everywhere,
 * with zero extra code in the feature modules.
 * -----------------------------------------------------------------------
 */

const DB = (() => {
  const LS_PREFIX = "afpvluna_";
  const TABLES = ["users","patients","cases","opd_visits","directory","tasks","activity_logs","legends","session"];

  // ---- local (localStorage) engine -------------------------------------
  function lsKey(table) { return LS_PREFIX + table; }

  function lsRead(table) {
    try { return JSON.parse(localStorage.getItem(lsKey(table))) || []; }
    catch { return []; }
  }
  function lsWrite(table, rows) {
    localStorage.setItem(lsKey(table), JSON.stringify(rows));
  }

  function uid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  // ---- Supabase client (auth only, for now) ------------------------------
  // Everything else in this file still runs against localStorage (DB_MODE
  // stays "local" for reads/writes elsewhere in the app — see the note in
  // the SUPABASE MIGRATION SKETCH near the bottom of this file). Auth is
  // wired up for real, though: when DB_MODE is "supabase", sign-in/sign-up
  // create real Supabase Auth users and a matching public.users row with
  // auth_uid set, so the RLS policies in schema.sql actually take effect
  // once the rest of the CRUD layer is migrated.
  let _supa = null;
  function supa() {
    if (!_supa) {
      if (typeof supabase === "undefined") {
        throw new Error("Supabase client library not loaded (check the CDN script tag).");
      }
      _supa = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
    }
    return _supa;
  }

  // ---- Auth (real Supabase Auth when DB_MODE === "supabase") ------------
  const Auth = {
    // Creates a real Supabase Auth account. The matching public.users
    // profile row is created automatically by a database trigger (see
    // AFP-VLUNA-auth-fix.sql — it fires on auth.users insert and runs with
    // elevated privileges, so it doesn't need or wait on an RLS-governed
    // client insert). Returns { profile, needsConfirmation }: profile is
    // null when the project has "Confirm email" turned on, since no
    // session (and therefore no readable row) exists until the user
    // confirms.
    async signUp(email, password, profile) {
      const sb = supa();
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: profile } // -> auth.users.raw_user_meta_data, read by the trigger
      });
      if (error) throw error;

      if (!data.session) {
        // Email confirmation required — no session yet, so the profile
        // row (created by the trigger) isn't readable by this client
        // until after confirmation + login.
        return { profile: null, needsConfirmation: true };
      }

      const { data: row, error: rowErr } = await sb
        .from("users").select("*").eq("auth_uid", data.user.id).single();
      if (rowErr) throw rowErr;
      return { profile: row, needsConfirmation: false };
    },

    // Signs in via Supabase Auth, then loads the matching public.users
    // profile row (matched by auth_uid) for the app-level session.
    async signIn(email, password) {
      const sb = supa();
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      const authUid = data.user?.id;
      const { data: profile, error: profileErr } = await sb
        .from("users").select("*").eq("auth_uid", authUid).single();
      if (profileErr) throw profileErr;
      return profile;
    },

    async signOut() {
      const sb = supa();
      const { error } = await sb.auth.signOut();
      if (error) throw error;
    },

    // Restores a session on page load (e.g. after refresh) from Supabase's
    // own persisted auth token, re-fetching the matching profile row.
    async restoreSession() {
      const sb = supa();
      const { data, error } = await sb.auth.getSession();
      if (error || !data.session) return null;
      const authUid = data.session.user.id;
      const { data: profile, error: profileErr } = await sb
        .from("users").select("*").eq("auth_uid", authUid).single();
      if (profileErr) return null;
      return profile;
    }
  };

  // ---- public API (local implementation) --------------------------------
  const api = {
    mode: APP_CONFIG.DB_MODE,

    all(table) {
      return lsRead(table);
    },

    get(table, id) {
      return lsRead(table).find(r => r.id === id) || null;
    },

    query(table, predicate) {
      return lsRead(table).filter(predicate);
    },

    insert(table, row, actor = null) {
      const rows = lsRead(table);
      const rec = { id: uid(), created_at: nowISO(), updated_at: nowISO(), ...row };
      rows.push(rec);
      lsWrite(table, rows);
      if (table !== "activity_logs") {
        this._log(table, rec.id, "create", actor, null, rec);
      }
      return rec;
    },

    update(table, id, patch, actor = null) {
      const rows = lsRead(table);
      const idx = rows.findIndex(r => r.id === id);
      if (idx === -1) return null;
      const before = { ...rows[idx] };
      rows[idx] = { ...rows[idx], ...patch, updated_at: nowISO() };
      lsWrite(table, rows);
      if (table !== "activity_logs") {
        this._log(table, id, "update", actor, before, rows[idx]);
      }
      return rows[idx];
    },

    remove(table, id, actor = null) {
      const rows = lsRead(table);
      const before = rows.find(r => r.id === id);
      const next = rows.filter(r => r.id !== id);
      lsWrite(table, next);
      if (table !== "activity_logs" && before) {
        this._log(table, id, "delete", actor, before, null);
      }
      return true;
    },

    _log(module, recordId, action, actor, before, after) {
      const rows = lsRead("activity_logs");
      rows.unshift({
        id: uid(),
        created_at: nowISO(),
        module, record_id: recordId, action,
        actor_id: actor?.id || null,
        actor_name: actor ? `${actor.first_name} ${actor.last_name}` : "System",
        before: before ? JSON.stringify(before) : null,
        after: after ? JSON.stringify(after) : null
      });
      lsWrite("activity_logs", rows.slice(0, 5000)); // cap demo log size
    },

    // ---- session helpers --------------------------------------------
    getSession() {
      try { return JSON.parse(localStorage.getItem(lsKey("session"))); } catch { return null; }
    },
    setSession(user) {
      localStorage.setItem(lsKey("session"), JSON.stringify(user));
    },
    clearSession() {
      localStorage.removeItem(lsKey("session"));
    },

    // ---- Users -> Directory auto-sync ----------------------------------
    // Every registered user (signup or admin edit) gets mirrored into the
    // `directory` table so the Directory module always contains "all the
    // Users in the Users tab" per the spec. Matched by `user_id` so re-syncing
    // an edited profile updates the same directory row instead of duplicating
    // it. Directory contacts added manually (no `user_id`) are untouched.
    syncUserToDirectory(user, actor = null) {
      const existing = this.query("directory", d => d.user_id === user.id)[0];
      const payload = {
        user_id: user.id,
        last_name: user.last_name, first_name: user.first_name, middle_name: user.middle_name,
        gender: user.gender, rank: user.rank, department: user.department,
        designation: user.designation, contact_number: user.contact_number,
        email: user.email, address: user.address, birthdate: user.birthdate
      };
      if (existing) return this.update("directory", existing.id, payload, actor);
      return this.insert("directory", payload, actor);
    },

    // ---- first-run seeding --------------------------------------------
    seedIfEmpty() {
      if (this.all("legends").length === 0) {
        const legendRows = [];
        for (const [key, val] of Object.entries(LEGENDS_SEED)) {
          legendRows.push({ id: uid(), created_at: nowISO(), updated_at: nowISO(), category: key, data: val });
        }
        lsWrite("legends", legendRows);
      }

      // Demo local-account seeding only makes sense in "local" mode — in
      // "supabase" mode, real accounts are created via Auth.signUp() /
      // your own Supabase dashboard instead, so this whole block is skipped.
      if (APP_CONFIG.DB_MODE === "local" && this.all("users").length === 0) {
        const admin = {
          id: uid(), created_at: nowISO(), updated_at: nowISO(),
          email: "admin@afp-vluna.mil.ph",
          password: "Admin@2026",
          last_name: "Santos", first_name: "Maria Cristina", middle_name: "R.",
          gender: "Female", designation: "OB-Surgeon", rank: "COL",
          department: "Obstetrics and Gynecology (OB-GYN)",
          address: "V. Luna General Hospital, Quezon City",
          contact_number: "09171234567", birthdate: "1978-04-12",
          user_level: "Admin", status: "approved", access_opd: true
        };
        const chief = {
          id: uid(), created_at: nowISO(), updated_at: nowISO(),
          email: "chief.resident@afp-vluna.mil.ph",
          password: "Chief@2026",
          last_name: "Dela Cruz", first_name: "Juan", middle_name: "P.",

        };
        const pending = {
          id: uid(), created_at: nowISO(), updated_at: nowISO(),
          email: "resident.new@afp-vluna.mil.ph",
          password: "Newres@2026",
          last_name: "Reyes", first_name: "Angela", middle_name: "M.",
          gender: "Female", designation: "OB-Doctor", rank: "1LT",

          user_level: "Junior", status: "pending", access_opd: false
        };
        lsWrite("users", [admin, chief, pending]);
        [admin, chief, pending].forEach(u => this.syncUserToDirectory(u));
      }

      if (this.all("patients").length === 0) {
        const demoPatients = [
          { last_name: "Bautista", first_name: "Liza", middle_name: "G.", gender: "Female",
            birthdate: "1994-05-11", rank: "SGT", bos: "PA", pc: "MIL", care_of: "AFPMC",
            address: "Fort Bonifacio, Taguig", contact_number: "09201112222",
            email: "liza.bautista@example.mil.ph", notes: "", status: "Admitted" },
          { last_name: "Fernandez", first_name: "Grace", middle_name: "T.", gender: "Female",
            birthdate: "1990-11-02", rank: "CIV", bos: "PAF", pc: "DEP", care_of: "MAJ Fernandez, PAF",

        demoPatients.forEach(p => this.insert("patients", p));
      }

      // Note: Directory is no longer separately seeded here — every seeded
      // user above is auto-synced into it via syncUserToDirectory(). Emergency

      if (this.all("tasks").length === 0) {
        const chiefUser = this.query("users", u => u.email === "chief.resident@afp-vluna.mil.ph")[0];
        const adminUser = this.query("users", u => u.email === "admin@afp-vluna.mil.ph")[0];

  };

  api.auth = Auth;
  return api;
})();

            <h1>${APP_CONFIG.APP_FULL_NAME}</h1>
            <p>Health Surveillance &amp; Records System &mdash; Sign in</p>
          </div>
          <div id="loginAlert"></div>
          <form class="login-form" id="loginForm">
            <div class="field">
              <label>Username (email)</label>
              <input type="email" id="loginEmail" required placeholder="you@afp-vluna.mil.ph">
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="loginPassword" required placeholder="********">
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
          </form>
          <div class="login-switch">Don't have an account? <a id="goSignup">Sign up</a></div>
          ${APP_CONFIG.DB_MODE === "local" ? `
          <div class="mt-16 muted" style="font-size:11.5px; text-align:center;">
            Demo accounts &mdash; Admin: admin@afp-vluna.mil.ph / Admin@2026<br>
            Chief Resident: chief.resident@afp-vluna.mil.ph / Chief@2026
          </div>` : `
          <div class="mt-16 muted" style="font-size:11.5px; text-align:center;">
            Sign up below to create an account, then ask an Admin to approve it.
          </div>`}
        </div>
      </div>`;

    document.getElementById("goSignup").addEventListener("click", () => renderSignup(root));
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pw = document.getElementById("loginPassword").value;
      const alertBox = document.getElementById("loginAlert");
      const submitBtn = e.target.querySelector("button[type=submit]");

      let user;
      if (APP_CONFIG.DB_MODE === "supabase") {
        submitBtn.disabled = true;
        try {
          user = await DB.auth.signIn(email, pw);
        } catch (err) {
          alertBox.innerHTML = `<div class="login-alert error">${esc(err.message || "Invalid username or password.")}</div>`;
          submitBtn.disabled = false;
          return;
        }
        submitBtn.disabled = false;
      } else {
        user = DB.query("users", u => u.email.toLowerCase() === email && u.password === pw)[0];
        if (!user) {
          alertBox.innerHTML = `<div class="login-alert error">Invalid username or password.</div>`;
          return;
        }
      }

      if (user.status === "pending") {
        DB.setSession(user);
        renderPendingScreen(document.getElementById("root"));
        return;
      }
      DB.setSession(user);
      DB._log("users", user.id, "login", user, null, null);
      location.hash = "#/overview";
      route();
    });
  }

          </div>
          <div id="signupAlert"></div>
          <form id="signupForm">
            <div class="form-grid">
              <div class="field"><label>Username (email)</label><input type="email" id="su_email" required></div>
              <div class="field"><label>Password</label><input type="password" id="su_pw" required>
                <span class="hint">8+ chars, letters, 1 number, 1 symbol</span></div>
              <div class="field"><label>Confirm Password</label><input type="password" id="su_pw2" required></div>
              <div class="field"><label>Last Name</label><input type="text" id="su_ln" required></div>
              <div class="field"><label>First Name</label><input type="text" id="su_fn" required></div>
              <div class="field"><label>Middle Name</label><input type="text" id="su_mn"></div>
              <div class="field"><label>Gender</label>
                <select id="su_gender"><option>Female</option><option>Male</option></select></div>
              <div class="field"><label>Designation</label><select id="su_desig">${legendOptions("designation")}</select></div>
              <div class="field"><label>Rank</label><select id="su_rank">${legendOptions("rank")}</select></div>
              <div class="field span-2"><label>Department</label><select id="su_dept">${legendOptions("department")}</select></div>
              <div class="field span-3"><label>Address</label><input type="text" id="su_addr"></div>
              <div class="field"><label>Contact Number</label><input type="text" id="su_contact"></div>
              <div class="field"><label>Birthdate</label><input type="date" id="su_bd" required></div>
              <div class="field"><label>Age</label><input type="text" id="su_age" disabled placeholder="auto"></div>
            </div>
            <button type="submit" class="btn btn-primary mt-16" style="width:100%; justify-content:center;">Create Account</button>
          </form>
          <div class="login-switch">Already have an account? <a id="backToLogin">Sign in</a></div>
        </div>
      </div>`;

    document.getElementById("su_bd").addEventListener("change", (e) => {
      document.getElementById("su_age").value = computeAge(e.target.value);
    });
    document.getElementById("backToLogin").addEventListener("click", () => render(root));

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("signupAlert");
      const pw = document.getElementById("su_pw").value;
      const pw2 = document.getElementById("su_pw2").value;
      const email = document.getElementById("su_email").value.trim().toLowerCase();
      const submitBtn = e.target.querySelector("button[type=submit]");

      if (!passwordValid(pw)) {
        alertBox.innerHTML = `<div class="login-alert error">Password must be 8+ characters with letters, at least one number and one symbol.</div>`;
        return;
      }
      if (pw !== pw2) {
        alertBox.innerHTML = `<div class="login-alert error">Passwords do not match.</div>`;
        return;
      }

      const profile = {
        last_name: document.getElementById("su_ln").value,
        first_name: document.getElementById("su_fn").value,
        middle_name: document.getElementById("su_mn").value,
        gender: document.getElementById("su_gender").value,
        designation: document.getElementById("su_desig").value,
        rank: document.getElementById("su_rank").value,
        department: document.getElementById("su_dept").value,
        address: document.getElementById("su_addr").value,
        contact_number: document.getElementById("su_contact").value,
        birthdate: document.getElementById("su_bd").value
      };

      let rec, needsConfirmation = false;
      if (APP_CONFIG.DB_MODE === "supabase") {
        submitBtn.disabled = true;
        try {
          const result = await DB.auth.signUp(email, pw, profile);
          rec = result.profile;
          needsConfirmation = result.needsConfirmation;
        } catch (err) {
          alertBox.innerHTML = `<div class="login-alert error">${esc(err.message || "Could not create account.")}</div>`;
          submitBtn.disabled = false;
          return;
        }
        submitBtn.disabled = false;
      } else {
        if (DB.query("users", u => u.email.toLowerCase() === email).length) {
          alertBox.innerHTML = `<div class="login-alert error">An account with this email already exists.</div>`;
          return;
        }
        rec = DB.insert("users", {
          email, password: pw,
          ...profile,
          user_level: "Staff",
          status: "pending",
          access_opd: false
        });
      }

      if (needsConfirmation) {
        // No session yet (email confirmation required) — nothing to cache
        // or sync to Directory until the user confirms and logs in.
        root.innerHTML = `
          <div class="login-wrap">
            <div class="login-card">
              <div class="login-brand">
                <h1>Check your email</h1>
                <p>We've sent a confirmation link to <b>${esc(email)}</b>. Confirm it, then sign in — an Admin will still need to approve your account before you get full access.</p>
              </div>
              <button class="btn btn-primary" id="backToLoginConfirm" style="width:100%; justify-content:center;">Back to Sign In</button>
            </div>
          </div>`;
        document.getElementById("backToLoginConfirm").addEventListener("click", () => render(root));
        return;
      }

      // Directory is still local-only for now (see the DB_MODE note at the
      // top of db.js), so this mirrors the new profile into it either way.
      DB.syncUserToDirectory(rec, rec);
      DB.setSession(rec);
      renderPendingScreen(document.getElementById("root"));
    });
  }

// ==== js/modules/users.js ====
/** modules/users.js — Users Module */
const ModuleUsers = (() => {
  let searchTerm = "";
  let levelFilter = "";

  function sortUsers(list) {
    const pending = list.filter(u => u.status === "pending");
    const approved = list.filter(u => u.status !== "pending")
      .sort((a,b) => a.last_name.localeCompare(b.last_name));
    return [...pending, ...approved];
  }

  function render(container) {
    const all = DB.all("users");

    container.innerHTML = `
      ${taskWidget("Users")}
      <div class="card">
        <div class="section-title">Users <span class="tag">${all.length} total</span></div>
        <div class="flex gap-12 mb-12" style="flex-wrap:wrap;">
          <input type="text" id="userSearch" placeholder="Search email, username, name..." style="flex:1; min-width:220px; padding:8px 10px; border:1px solid var(--border); border-radius:7px;">
          <select id="levelFilter" style="padding:8px 10px; border:1px solid var(--border); border-radius:7px;">
            <option value="">All User Levels</option>
            ${legendOptions("userLevel")}
          </select>
        </div>
        <div id="usersTableWrap"></div>
      </div>
      <div id="activityStripHost"></div>
    `;

    document.getElementById("activityStripHost").appendChild(recentActivityStrip("Users"));

    document.getElementById("userSearch").addEventListener("input", (e) => { searchTerm = e.target.value.toLowerCase(); drawTable(); });
    document.getElementById("levelFilter").addEventListener("change", (e) => { levelFilter = e.target.value; drawTable(); });

    drawTable();

    function drawTable() {
      let list = DB.all("users").filter(u =>
        (!levelFilter || u.user_level === levelFilter) &&
        (!searchTerm || `${u.email} ${u.first_name} ${u.last_name}`.toLowerCase().includes(searchTerm))
      );
      list = sortUsers(list);
      const wrap = document.getElementById("usersTableWrap");
      if (list.length === 0) { wrap.innerHTML = `<div class="empty-state">No users match your filters.</div>`; return; }
      wrap.innerHTML = `
        <table class="data-table">
          <thead><tr><th></th><th>Last Name</th><th>First Name</th><th>Email</th><th>Contact</th><th>User Level</th><th>Status</th></tr></thead>
          <tbody>
            ${list.map(u => `
              <tr data-id="${u.id}">
                <td>${u.status === "pending" ? `<span title="Pending approval">&#128993;</span>` : ""}</td>
                <td>${esc(u.last_name)}</td>
                <td>${esc(u.first_name)}</td>
                <td><a href="mailto:${esc(u.email)}" onclick="event.stopPropagation()">${esc(u.email)}</a></td>
                <td><a href="tel:${esc(u.contact_number)}" onclick="event.stopPropagation()">${esc(u.contact_number||"")}</a></td>
                <td>${esc(u.user_level)}</td>
                <td><span class="badge ${u.status==='pending'?'st-pending':'neutral'}">${esc(u.status)}</span></td>
              </tr>`).join("")}
          </tbody>
        </table>`;
      wrap.querySelectorAll("tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => openProfile(tr.dataset.id));
      });
    }
  }

  function openOwnProfile() {
    const u = currentUser();
    if (u) openProfile(u.id);
  }

  function openProfile(id) {
    const u = DB.get("users", id);
    if (!u) return;
    const isAdmin = requireAdmin();
    const activities = DB.query("activity_logs", a => a.actor_id === id)
      .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    const modal = openModal({
      title: `${esc(u.rank)} ${esc(u.last_name)}, ${esc(u.first_name)}`,
      bodyHtml: `
        <div class="grid cols-2 mb-16">
          <div>
            <div class="muted">Email</div><div>${esc(u.email)}</div>
            <div class="muted mt-8">Contact</div><div>${esc(u.contact_number||"-")}</div>
            <div class="muted mt-8">Gender</div><div>${esc(u.gender||"-")}</div>
            <div class="muted mt-8">Birthdate / Age</div><div>${esc(fmtPHDate(u.birthdate))} (${computeAge(u.birthdate)})</div>
          </div>
          <div>
            <div class="muted">Rank / Designation</div><div>${esc(u.rank)} &mdash; ${esc(u.designation)}</div>
            <div class="muted mt-8">Department</div><div>${esc(u.department)}</div>
            <div class="muted mt-8">Address</div><div>${esc(u.address||"-")}</div>
            <div class="muted mt-8">User Level</div><div>${esc(u.user_level)}</div>
          </div>
        </div>
        <div class="section-title">Access Control</div>
        <label class="flex gap-8 mb-16"><input type="checkbox" id="accessOpd" ${u.access_opd?"checked":""} ${isAdmin?"":"disabled"}> OPD module access</label>
        <div class="section-title">Recent Activity <span class="tag">${activities.length}</span></div>
        <div id="userActivityWrap"></div>
      `,
      footerHtml: `
        ${u.status === "pending" && isAdmin ? `<button class="btn btn-danger" data-decline>Decline</button><button class="btn btn-primary" data-approve>Approve</button>` : ""}
        <button class="btn btn-secondary" data-pdf>Download PDF</button>
        ${isAdmin ? `<button class="btn btn-secondary" data-edit>Edit</button><button class="btn btn-danger" data-delete>Delete</button>` : ""}
        <button class="btn btn-outline" data-close>Close</button>
      `,
      onMount: (el) => {
        drawActivity(el, activities);
        el.querySelector("#accessOpd")?.addEventListener("change", (e) => {
          DB.update("users", u.id, { access_opd: e.target.checked }, currentUser());
          toast("Access control updated.");
        });
        el.querySelector("[data-approve]")?.addEventListener("click", () => {
          DB.update("users", u.id, { status: "approved" }, currentUser());
          toast(`${u.first_name} approved.`); el.remove(); route();
        });
        el.querySelector("[data-decline]")?.addEventListener("click", () => {
          DB.update("users", u.id, { status: "declined" }, currentUser());
          toast(`${u.first_name} declined.`); el.remove(); route();
        });
        el.querySelector("[data-delete]")?.addEventListener("click", () => {
          if (confirm("Delete this user account?")) { DB.remove("users", u.id, currentUser()); el.remove(); route(); }
        });
        el.querySelector("[data-pdf]")?.addEventListener("click", () => exportUserPdf(u, activities));
        el.querySelector("[data-edit]")?.addEventListener("click", () => { el.remove(); openEditForm(u); });
      }
    });

    function drawActivity(el, acts) {
      const host = el.querySelector("#userActivityWrap");
      let page = 0; const size = 5;
      function draw() {
        const slice = acts.slice(page*size, page*size+size);
        host.innerHTML = slice.length ? `
          <table class="data-table"><thead><tr><th>When</th><th>Module</th><th>Action</th></tr></thead>
          <tbody>${slice.map(a=>`<tr><td>${fmtPH(a.created_at)}</td><td>${esc(a.module)}</td><td>${esc(a.action)}</td></tr>`).join("")}</tbody></table>
          <div class="pager">
            <button data-p ${page===0?"disabled":""}>&#8592; Prev</button>
            <span class="muted">Page ${page+1} of ${Math.max(1,Math.ceil(acts.length/size))}</span>
            <button data-n ${((page+1)*size>=acts.length)?"disabled":""}>Next &#8594;</button>
          </div>` : `<div class="muted">No activity recorded yet.</div>`;
        host.querySelector("[data-p]")?.addEventListener("click", () => { page--; draw(); });
        host.querySelector("[data-n]")?.addEventListener("click", () => { page++; draw(); });
      }
      draw();
    }
  }

  function exportUserPdf(u, activities) {
    const doc = new jspdf.jsPDF();
    doc.setFontSize(14); doc.text("AFP-VLUNA — User Activity Report", 14, 16);
    doc.setFontSize(10);
    doc.text(`${u.rank} ${u.last_name}, ${u.first_name} — ${u.designation}`, 14, 24);
    doc.text(`Email: ${u.email}  |  Level: ${u.user_level}  |  Generated: ${fmtPH(nowISO())}`, 14, 30);
    let y = 42;
    doc.setFontSize(11); doc.text("Recent Activity", 14, y); y += 6;
    doc.setFontSize(9);
    activities.slice(0, 40).forEach(a => {
      doc.text(`${fmtPH(a.created_at)}  |  ${a.module}  |  ${a.action}`, 14, y);
      y += 6;
      if (y > 280) { doc.addPage(); y = 16; }
    });
    doc.save(`user-activity-${u.last_name}.pdf`);
  }

  function openEditForm(u) {
    openModal({
      title: `Edit User — ${esc(u.first_name)} ${esc(u.last_name)}`,
      bodyHtml: `
        <div class="form-grid">
          <div class="field"><label>Last Name</label><input id="e_ln" value="${esc(u.last_name)}"></div>
          <div class="field"><label>First Name</label><input id="e_fn" value="${esc(u.first_name)}"></div>
          <div class="field"><label>Middle Name</label><input id="e_mn" value="${esc(u.middle_name||"")}"></div>
          <div class="field"><label>Rank</label><select id="e_rank">${legendOptions("rank")}</select></div>
          <div class="field span-2"><label>Department</label><select id="e_dept">${legendOptions("department")}</select></div>
          <div class="field"><label>User Level</label><select id="e_level">${legendOptions("userLevel")}</select></div>
          <div class="field span-2"><label>Contact Number</label><input id="e_contact" value="${esc(u.contact_number||"")}"></div>
        </div>`,
      footerHtml: `<button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button>`,
      onMount: (el) => {
        el.querySelector("#e_rank").value = u.rank;
        el.querySelector("#e_dept").value = u.department;
        el.querySelector("#e_level").value = u.user_level;
        el.querySelector("[data-save]").addEventListener("click", () => {
          const updated = DB.update("users", u.id, {
            last_name: el.querySelector("#e_ln").value,
            first_name: el.querySelector("#e_fn").value,
            middle_name: el.querySelector("#e_mn").value,
            rank: el.querySelector("#e_rank").value,
            department: el.querySelector("#e_dept").value,
            user_level: el.querySelector("#e_level").value,
            contact_number: el.querySelector("#e_contact").value
          }, currentUser());
          DB.syncUserToDirectory(updated, currentUser());
          toast("User updated — Directory entry kept in sync."); el.remove(); route();
        });
      }
    });
  }

  return { render, openOwnProfile };
})();

  function render(container) {
    container.innerHTML = `
      ${taskWidget("Patient Record")}

// ---- shared CSV helpers (used by patients / cases / opd / legends) --------
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines.shift().split(",").map(h => h.trim());
  return lines.filter(l => l.trim()).map(line => {
    const cells = line.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cells[i]||"").trim());
    return obj;
  });
}

    const tabs = ["Admission","Obstetric History","Co-morbidities","Gynecological Conditions","MIGS Information","Blood","Final Diagnosis","Discharge"];

    const modal = openModal({
      title: existing ? `Case ${esc(caseNumber(existing))}` : "New OB-GYN Case",
      bodyHtml: `
        <div class="tabbar" id="caseTabs">${tabs.map((t,i)=>`<button data-i="${i}" class="${i===0?'active':''}">${i+1}. ${t}</button>`).join("")}</div>
        <div id="tabPanels"></div>`,
      footerHtml: `<button class="btn btn-outline" data-close>Close</button>${existing ? `<button class="btn btn-secondary" data-pdf>Download PDF</button>` : ""}<button class="btn btn-primary" data-save>Save Case</button>`,
      onMount: (el) => {
        const panels = el.querySelector("#tabPanels");
        panels.innerHTML = tabs.map((t,i) => `<div class="tab-panel ${i===0?'active':''}" data-panel="${i}">${panelHtml(i, c)}</div>`).join("");
        wirePanels(el, c);
        el.querySelectorAll("#caseTabs button").forEach(btn => {
          btn.addEventListener("click", () => {
            el.querySelectorAll("#caseTabs button").forEach(b=>b.classList.remove("active"));
            el.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
            btn.classList.add("active");
            el.querySelector(`.tab-panel[data-panel="${btn.dataset.i}"]`).classList.add("active");
          });
        });
        el.querySelector("[data-save]").addEventListener("click", () => saveObgynForm(el, c, existing));
        el.querySelector("[data-pdf]")?.addEventListener("click", () => exportCasePdf(c));
      }
    });
  }

  function panelHtml(i, c) {
    switch(i) {
      case 0: return `
        <div class="form-grid">
          <div class="field"><label>Date of Admission</label><input type="date" id="adm_date" value="${esc(c.admission_date||"")}"></div>
          <div class="field span-2"><label>Patient <button class="btn btn-outline btn-sm" id="newPatientInline" type="button">+ New Patient</button></label>
            <select id="adm_patient">${DB.all("patients").map(p=>`<option value="${p.id}" ${c.patient_id===p.id?"selected":""}>${esc(p.last_name)}, ${esc(p.first_name)} (${esc(p.rank)})</option>`).join("")}</select></div>
          <div class="field"><label>Weight (kg)</label><input type="number" id="adm_weight" value="${esc(c.weight||"")}"></div>
          <div class="field"><label>Height (cm)</label><input type="number" id="adm_height" value="${esc(c.height||"")}"></div>
          <div class="field"><label>BMI (kg/m2)</label><input id="adm_bmi" disabled value="${esc(c.bmi||"")}"></div>
          <div class="field"><label>Case Type</label><select id="adm_casetype">${legendOptions("caseType")}</select></div>
          <div class="field"><label>PCOS History?</label><select id="adm_pcos"><option>No</option><option>Yes</option></select></div>
          <div class="field"><label>EVAC?</label><select id="adm_evac"><option>No</option><option>Yes</option></select></div>
          <div class="field"><label>EVAC From</label><select id="adm_evacfrom">${legendOptions("evacFrom")}</select></div>
        </div>
        <div class="muted mt-8">Selecting a patient auto-fills Rank, BOS, PC, Age, Birthdate, Care of, Address, Contact, Email, Notes from the Patient Record.</div>
        <div class="grid cols-3 mt-8" id="adm_autofill"></div>`;
      case 1: return `
        <div class="form-grid">
          <div class="field"><label>G (# of Pregnancy)</label><input type="number" id="ob_g" value="${esc(c.ob_g||"")}"></div>
          <div class="field"><label>P (# of Delivery)</label><input type="number" id="ob_p" value="${esc(c.ob_p||"")}"></div>
          <div class="field"><label>FT (# Full Term)</label><input type="number" id="ob_ft" value="${esc(c.ob_ft||"")}"></div>
          <div class="field"><label>PT (# Preterm)</label><input type="number" id="ob_pt" value="${esc(c.ob_pt||"")}"></div>
          <div class="field"><label>Ab (# Abortions)</label><input type="number" id="ob_ab" value="${esc(c.ob_ab||"")}"></div>
        </div>`;
      case 2: return `
        <div class="flex gap-8 mb-12">
          <select id="cm_pick" style="flex:1;">${legendList("comorbidity").map(g=>`<optgroup label="${esc(g.group)}">${g.items.map(it=>`<option>${esc(it)}</option>`).join("")}</optgroup>`).join("")}</select>
          <button class="btn btn-secondary btn-sm" id="cm_add" type="button">+ Add Comorbidity</button>
          <button class="btn btn-outline btn-sm" id="cm_notlisted" type="button">+ Not in the list</button>
        </div>
        <div class="pill-list" id="cm_list"></div>`;
      case 3: return `
        <div class="muted mb-12">Please indicate the final diagnosis. The diagnosis must be confirmed by Histopath if applicable. If not found in the dropdown, use "+ Not in the list". You can always add.</div>
        <div class="flex gap-8 mb-12">
          <select id="reason_pick" style="flex:1;">${legendOptions("obgynAdmissionReason")}</select>
          <button class="btn btn-secondary btn-sm" id="reason_add" type="button">+ Add OB-GYN Admission Reason</button>
          <button class="btn btn-outline btn-sm" id="reason_notlisted" type="button">+ Not in the list</button>
        </div>
        <div class="pill-list mb-16" id="reason_list"></div>

        <div class="section-title">Gyne Procedures</div>
        <div class="field mb-12"><label>Type of Surgery</label>
          <select id="surg_type"><option>None</option><option>Minor</option><option>Major</option></select></div>
        <div id="surgeryBlock"></div>`;
      case 4: return `
        <div class="form-grid">
          <div class="field"><label>Is the MIGS Surgeon any of the following?</label><select id="migs_surgeon"><option>N/A</option><option>Fellow</option><option>No</option></select></div>
          <div class="field"><label>Is the MIGS Assist any of the following?</label><select id="migs_assist"><option>N/A</option><option>Fellow</option><option>No</option></select></div>
        </div>`;
      case 5: return `
        <div class="form-grid">
          <div class="field"><label>Blood Transfused</label><select id="blood_transfused"><option>No</option><option>Yes</option></select></div>
          <div class="field"><label>Blood Reaction</label><select id="blood_reaction"><option>No</option><option>Yes</option></select></div>
        </div>`;
      case 6: return `
        <div class="flex gap-8 mb-12"><input id="diag_input" placeholder="Type a diagnosis bullet and press Add" style="flex:1; padding:8px; border:1px solid var(--border); border-radius:7px;"><button class="btn btn-secondary btn-sm" id="diag_add" type="button">+ Add bullet</button></div>
        <ul id="diag_list" style="padding-left:18px;"></ul>`;
      case 7: return `
        <div class="form-grid">
          <div class="field"><label>Discharge Date</label><input type="date" id="dc_date" value="${esc(c.discharge_date||"")}"></div>

          <div class="field"><label>Within Allowable?</label><select id="dc_allowable"><option>Yes</option><option>No</option></select></div>
          <div class="field"><label>Patient Condition</label><select id="dc_condition"><option>Improved</option><option>Unimproved</option><option>Died</option></select></div>
          <div class="field span-2"><label>Discharge Status</label><select id="dc_status">${legendOptions("dischargeStatus")}</select></div>
        </div>`;

  function wirePanels(el, c) {
    // Tab 0 — Admission autofill + BMI compute
    const patientSel = el.querySelector("#adm_patient");
    function refreshAutofill() {
      const p = DB.get("patients", patientSel.value);
      const host = el.querySelector("#adm_autofill");
      if (!p) { host.innerHTML = ""; return; }
      host.innerHTML = ["Rank: "+esc(p.rank), "BOS: "+esc(p.bos), "PC: "+esc(p.pc), "Age: "+computeAge(p.birthdate),
        "Care of: "+esc(p.care_of||"-"), "Address: "+esc(p.address||"-"), "Contact: "+esc(p.contact_number||"-"), "Email: "+esc(p.email||"-")]
        .map(t=>`<div class="pill">${t}</div>`).join("");
    }
    patientSel?.addEventListener("change", refreshAutofill);
    refreshAutofill();
    el.querySelector("#newPatientInline")?.addEventListener("click", () => {
      ModulePatients.openPatientForm(null, (rec) => {
        const opt = document.createElement("option");
        opt.value = rec.id; opt.textContent = `${rec.last_name}, ${rec.first_name}`;
        patientSel.appendChild(opt); patientSel.value = rec.id; refreshAutofill();
      });
    });
    function computeBmi() {
      const w = parseFloat(el.querySelector("#adm_weight").value);
      const h = parseFloat(el.querySelector("#adm_height").value) / 100;
      if (w && h) el.querySelector("#adm_bmi").value = (w / (h*h)).toFixed(1);
    }
    el.querySelector("#adm_weight")?.addEventListener("input", computeBmi);
    el.querySelector("#adm_height")?.addEventListener("input", computeBmi);
    if (c.case_type) el.querySelector("#adm_casetype").value = c.case_type;
    if (c.evac_from) el.querySelector("#adm_evacfrom").value = c.evac_from;

    // Tab 2 — comorbidities
    c._comorbidities = c.comorbidities ? [...c.comorbidities] : [];
    function drawCm() {
      el.querySelector("#cm_list").innerHTML = c._comorbidities.map((cm,idx)=>`<span class="pill">${esc(cm)} <button data-rm="${idx}">&times;</button></span>`).join("");
      el.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { c._comorbidities.splice(b.dataset.rm,1); drawCm(); }));
    }
    el.querySelector("#cm_add")?.addEventListener("click", () => { c._comorbidities.push(el.querySelector("#cm_pick").value); drawCm(); });
    el.querySelector("#cm_notlisted")?.addEventListener("click", () => promptAddToLegend("comorbidity-flat", "Comorbidity"));
    drawCm();

    // Tab 3 — admission reasons + surgery
    c._reasons = c.admission_reasons ? [...c.admission_reasons] : [];
    function drawReasons() {
      el.querySelector("#reason_list").innerHTML = c._reasons.map((r,idx)=>`<span class="pill">${esc(r)} <button data-rmr="${idx}">&times;</button></span>`).join("");
      el.querySelectorAll("[data-rmr]").forEach(b => b.addEventListener("click", () => { c._reasons.splice(b.dataset.rmr,1); drawReasons(); }));
    }
    el.querySelector("#reason_add")?.addEventListener("click", () => { c._reasons.push(el.querySelector("#reason_pick").value); drawReasons(); });
    el.querySelector("#reason_notlisted")?.addEventListener("click", () => promptAddToLegend("obgynAdmissionReason", "OB-GYN Admission Reason"));
    drawReasons();

    c._procedures = c.procedures ? [...c.procedures] : [];
    c._csIndications = c.cs_indications ? [...c.cs_indications] : (c.cs_indication ? [c.cs_indication] : []);
    c._surgeons = c.surgeons ? [...c.surgeons] : [];
    function drawSurgeryBlock() {
      const type = el.querySelector("#surg_type").value;
      const block = el.querySelector("#surgeryBlock");
      if (type === "None") { block.innerHTML = ""; return; }
      block.innerHTML = `
        <div class="picker-row mb-8">
          <select id="proc_pick">${legendOptions("obgynProcedures")}</select>
          <button class="btn btn-secondary btn-sm" id="proc_add" type="button">+ OB-GYN Procedure</button>
          <button class="btn btn-outline btn-sm" id="proc_notlisted" type="button">+ Not in the list</button>
        </div>
        <div class="pill-list mb-16" id="proc_list"></div>

        <div class="field mb-8"><label>Indication/s for PRIMARY CS</label></div>
        <div class="picker-row mb-8">
          <select id="cs_indication_pick">${legendOptions("indicationPrimaryCS")}</select>
          <button class="btn btn-secondary btn-sm" id="cs_indication_add" type="button">+ Add Indication for Primary CS</button>
        </div>
        <div class="pill-list mb-16" id="cs_indication_list"></div>

        <div class="field mb-8"><label>Surgeon/s</label></div>
        <div class="picker-row mb-8">
          <select id="surgeon_pick">${DB.all("directory").map(d=>`<option value="${d.id}">${esc(d.rank||"")} ${esc(d.last_name)}, ${esc(d.first_name)}</option>`).join("")}</select>
          <button class="btn btn-secondary btn-sm" id="surgeon_add" type="button">+ Add Surgeon</button>
        </div>
        <div class="pill-list" id="surgeon_list"></div>`;

      function drawProc() {
        block.querySelector("#proc_list").innerHTML = c._procedures.map((p,idx)=>`<span class="pill">${esc(p.name)} <button data-rmp="${idx}">&times;</button></span>`).join("") || `<span class="muted" style="font-size:12px;">None added yet.</span>`;
        block.querySelectorAll("[data-rmp]").forEach(b => b.addEventListener("click", () => { c._procedures.splice(b.dataset.rmp,1); drawProc(); }));
      }
      block.querySelector("#proc_add").addEventListener("click", () => { c._procedures.push({ name: block.querySelector("#proc_pick").value, classification: type }); drawProc(); });
      block.querySelector("#proc_notlisted").addEventListener("click", () => promptAddToLegend("obgynProcedures", "OB-GYN Procedure"));
      drawProc();

      function drawCsIndications() {
        block.querySelector("#cs_indication_list").innerHTML = c._csIndications.map((v,idx)=>`<span class="pill">${esc(v)} <button data-rmi="${idx}">&times;</button></span>`).join("") || `<span class="muted" style="font-size:12px;">None added yet.</span>`;
        block.querySelectorAll("[data-rmi]").forEach(b => b.addEventListener("click", () => { c._csIndications.splice(b.dataset.rmi,1); drawCsIndications(); }));
      }
      block.querySelector("#cs_indication_add").addEventListener("click", () => {
        const val = block.querySelector("#cs_indication_pick").value;
        if (!c._csIndications.includes(val)) c._csIndications.push(val);
        drawCsIndications();
      });
      drawCsIndications();

      function drawSurgeons() {
        block.querySelector("#surgeon_list").innerHTML = c._surgeons.map((s,idx)=>`<span class="pill">${esc(s.name)} <button data-rms="${idx}">&times;</button></span>`).join("") || `<span class="muted" style="font-size:12px;">None added yet.</span>`;
        block.querySelectorAll("[data-rms]").forEach(b => b.addEventListener("click", () => { c._surgeons.splice(b.dataset.rms,1); drawSurgeons(); }));
      }
      block.querySelector("#surgeon_add").addEventListener("click", () => {
        const dirRec = DB.get("directory", block.querySelector("#surgeon_pick").value);
        if (!dirRec) return;
        const name = `${dirRec.rank||""} ${dirRec.last_name}, ${dirRec.first_name}`.trim();
        if (c._surgeons.some(s => s.directory_id === dirRec.id)) { toast("Already added."); return; }
        c._surgeons.push({ directory_id: dirRec.id, name });
        drawSurgeons();
      });
      drawSurgeons();
    }
    el.querySelector("#surg_type")?.addEventListener("change", drawSurgeryBlock);
    if (c.surgery_type) el.querySelector("#surg_type").value = c.surgery_type;
    drawSurgeryBlock();

    // Tab 6 — final diagnosis bullets
    c._diagnosis = c.final_diagnosis ? [...c.final_diagnosis] : [];
    function drawDiag() {
      el.querySelector("#diag_list").innerHTML = c._diagnosis.map((d,idx)=>`<li>${esc(d)} <button class="btn btn-sm" data-rmd="${idx}" style="background:none;color:var(--accent-red);">&times;</button></li>`).join("");
      el.querySelectorAll("[data-rmd]").forEach(b => b.addEventListener("click", () => { c._diagnosis.splice(b.dataset.rmd,1); drawDiag(); }));
    }
    el.querySelector("#diag_add")?.addEventListener("click", () => {
      const v = el.querySelector("#diag_input").value.trim();
      if (v) { c._diagnosis.push(v); el.querySelector("#diag_input").value = ""; drawDiag(); }
    });
    drawDiag();

    // Tab 7 — discharge auto compute hospital days
    function computeDays() {
      const admDate = el.querySelector("#adm_date")?.value;
      const dcDate = el.querySelector("#dc_date")?.value;
      el.querySelector("#dc_days").value = computeHospitalDays(admDate, dcDate);
    }
    el.querySelector("#dc_date")?.addEventListener("change", computeDays);
    if (c.within_allowable) el.querySelector("#dc_allowable").value = c.within_allowable;
    if (c.patient_condition) el.querySelector("#dc_condition").value = c.patient_condition;
    if (c.discharge_status) el.querySelector("#dc_status").value = c.discharge_status;
  }

  function promptAddToLegend(category, label) {
    openModal({
      title: `Add new ${label}`,
      bodyHtml: `<div class="field"><label>${label}</label><input id="newval" placeholder="Type new entry..."></div>`,
      footerHtml: `<button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-save>Add</button>`,
      onMount: (el2) => {
        el2.querySelector("[data-save]").addEventListener("click", () => {
          const v = el2.querySelector("#newval").value.trim();
          if (!v) return;
          const row = DB.query("legends", r => r.category === category)[0];
          if (row) DB.update("legends", row.id, { data: [...row.data, v] }, currentUser());
          toast(`Added "${v}" to ${label} — it's now in the dropdown database.`);
          el2.remove();
        });
      }
    });
  }

  function saveObgynForm(el, c, existing) {
    const patient = DB.get("patients", el.querySelector("#adm_patient")?.value);
    const payload = {
      department: "Obstetrics and Gynecology (OB-GYN)",
      patient_id: el.querySelector("#adm_patient")?.value,
      admission_date: el.querySelector("#adm_date")?.value,
      weight: el.querySelector("#adm_weight")?.value,
      height: el.querySelector("#adm_height")?.value,
      bmi: el.querySelector("#adm_bmi")?.value,
      case_type: el.querySelector("#adm_casetype")?.value,
      pcos_history: el.querySelector("#adm_pcos")?.value,
      evac: el.querySelector("#adm_evac")?.value,
      evac_from: el.querySelector("#adm_evacfrom")?.value,
      ob_g: el.querySelector("#ob_g")?.value, ob_p: el.querySelector("#ob_p")?.value,
      ob_ft: el.querySelector("#ob_ft")?.value, ob_pt: el.querySelector("#ob_pt")?.value, ob_ab: el.querySelector("#ob_ab")?.value,
      comorbidities: c._comorbidities || [],
      admission_reasons: c._reasons || [],
      surgery_type: el.querySelector("#surg_type")?.value,
      procedures: c._procedures || [],
      cs_indications: c._csIndications || [],
      surgeons: c._surgeons || [],
      migs_surgeon: el.querySelector("#migs_surgeon")?.value,
      migs_assist: el.querySelector("#migs_assist")?.value,
      blood_transfused: el.querySelector("#blood_transfused")?.value,
      blood_reaction: el.querySelector("#blood_reaction")?.value,
      final_diagnosis: c._diagnosis || [],
      discharge_date: el.querySelector("#dc_date")?.value,
      within_allowable: el.querySelector("#dc_allowable")?.value,
      patient_condition: el.querySelector("#dc_condition")?.value,
      discharge_status: el.querySelector("#dc_status")?.value,
      status: el.querySelector("#dc_date")?.value ? (el.querySelector("#dc_condition")?.value === "Died" ? "Deceased" : "Discharged") : "Admitted"
    };
    let rec;
    if (existing) {
      rec = DB.update("cases", existing.id, payload, currentUser());
      toast("Case updated.");
    } else {
      rec = DB.insert("cases", payload, currentUser());
      toast("Case created and synced to Patient Record.");
    }
    if (patient) DB.update("patients", patient.id, { status: payload.status }, currentUser());
    el.remove();
    route();
  }

  function openCase(id) {
    const c = DB.get("cases", id);
    if (!c) return;
    if (c.department === "Obstetrics and Gynecology (OB-GYN)") openObgynForm(c);
    else openModal({ title: caseNumber(c), bodyHtml: `<pre style="white-space:pre-wrap;">${esc(JSON.stringify(c,null,2))}</pre>`, footerHtml:`<button class="btn btn-outline" data-close>Close</button>` });
  }

  function exportCasePdf(c) {
    const p = DB.get("patients", c.patient_id) || {};
    const doc = new jspdf.jsPDF();
    doc.setFontSize(14); doc.text("AFP-VLUNA — OB-GYN Case Report", 14, 16);
    doc.setFontSize(10);
    doc.text(`Case: ${caseNumber(c)}  |  Patient: ${p.last_name||""}, ${p.first_name||""}`, 14, 24);
    doc.text(`Admission: ${c.admission_date||"-"}  Status: ${c.status||"-"}`, 14, 30);
    let y = 42;
    const lines = [
      `Case Type: ${c.case_type||"-"}`, `BMI: ${c.bmi||"-"}`,
      `Obstetric Score — G:${c.ob_g||0} P:${c.ob_p||0} FT:${c.ob_ft||0} PT:${c.ob_pt||0} Ab:${c.ob_ab||0}`,
      `Comorbidities: ${(c.comorbidities||[]).join(", ")||"None"}`,
      `Admission Reasons: ${(c.admission_reasons||[]).join(", ")||"None"}`,
      `Procedures: ${(c.procedures||[]).map(x=>x.name).join(", ")||"None"}`,
      `Indication/s for Primary CS: ${(c.cs_indications||[]).join(", ")||"None"}`,
      `Surgeon/s: ${(c.surgeons||[]).map(s=>s.name).join(", ")||"None"}`,
      `Final Diagnosis: ${(c.final_diagnosis||[]).join("; ")||"None"}`,
      `Discharge: ${c.discharge_date||"-"}  Status: ${c.discharge_status||"-"}  Condition: ${c.patient_condition||"-"}`
    ];
    lines.forEach(l => { doc.text(doc.splitTextToSize(l, 180), 14, y); y += 10; });
    doc.save(`case-${caseNumber(c)}.pdf`);
  }

  // ------------------------ Data Summary dashboard ------------------------
  function renderSummary(host) {
    const cases = DB.all("cases");
    const admitted = DB.query("patients", p=>p.status==="Admitted").length;
    const discharged = cases.filter(c=>c.status==="Discharged"||c.status==="Deceased");
    const withinAllowable = discharged.filter(c=>c.within_allowable==="Yes").length;
    const deaths = cases.filter(c=>c.patient_condition==="Died");
    const returnedToDuty = cases.filter(c=>c.discharge_status==="RETURN TO DUTY").length;

    const reasonCounts = countBy(cases.flatMap(c=>c.admission_reasons||[]));
    const minorProcs = countBy(cases.flatMap(c=>(c.procedures||[]).filter(p=>p.classification==="Minor").map(p=>p.name)));
    const majorProcs = countBy(cases.flatMap(c=>(c.procedures||[]).filter(p=>p.classification==="Major").map(p=>p.name)));
    const csIndications = countBy(cases.flatMap(c=>c.cs_indications||[]));

    host.innerHTML = `
      <div class="card mt-16">
        <div class="section-title">Cases Data Summary</div>
        <div class="grid cols-4 mb-16">
          ${statCard("Total Cases", cases.length, "accent-olive")}
          ${statCard("Currently Admitted", admitted, "accent-teal")}
          ${statCard("Total Discharges", discharged.length, "accent-amber")}
          ${statCard("% Returned to Duty", cases.length ? Math.round(returnedToDuty/cases.length*100)+"%" : "0%", "accent-red")}
        </div>
        <div class="grid cols-2 mb-16">
          <div class="card"><div class="section-title" style="font-size:13px;">OB vs GYNE (Admitted Cases)</div><div class="chart-box small"><canvas id="chartObGyne"></canvas></div></div>
          <div class="card"><div class="section-title" style="font-size:13px;">Top 10 Admission Reasons</div><div class="chart-box small"><canvas id="chartReasons"></canvas></div></div>
        </div>
        <div class="grid cols-2 mb-16">
          <div class="card"><div class="section-title" style="font-size:13px;">Minor Surgeries</div><div class="chart-box small"><canvas id="chartMinor"></canvas></div></div>
          <div class="card"><div class="section-title" style="font-size:13px;">Major Surgeries</div><div class="chart-box small"><canvas id="chartMajor"></canvas></div></div>
        </div>
        <div class="card mb-16"><div class="section-title" style="font-size:13px;">Indication for Primary CS</div><div class="chart-box small"><canvas id="chartCS"></canvas></div></div>
        <div class="grid cols-3">
          ${statCard("Total Deaths", deaths.length, "accent-red")}
          ${statCard("% Gross Death Rate", cases.length ? (deaths.length/cases.length*100).toFixed(1)+"%" : "0%", "accent-red")}
          ${statCard("% Patients w/ Allowable Stay", discharged.length ? (withinAllowable/discharged.length*100).toFixed(1)+"%" : "0%", "accent-teal")}
        </div>
      </div>`;

    drawBar("chartObGyne", ["OB","GYNE"], [cases.filter(c=>c.case_type==="OB").length, cases.filter(c=>c.case_type==="GYNE").length], "#0e5f5c");
    drawHBar("chartReasons", topN(reasonCounts, 10), "#455a28");
    drawHBar("chartMinor", topN(minorProcs, 10), "#189985");
    drawHBar("chartMajor", topN(majorProcs, 10), "#8a1f1f");
    drawHBar("chartCS", topN(csIndications, 10), "#a5680f");
  }

  function countBy(arr) {
    const map = {};
    arr.forEach(v => { if (v) map[v] = (map[v]||0)+1; });
    return map;
  }
  function topN(map, n) {
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
  }
  function drawBar(canvasId, labels, data, color) {
    const ctx = document.getElementById(canvasId); if (!ctx) return;
    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, { type:"bar", data:{ labels, datasets:[{ data, backgroundColor: color }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } });
  }
  function drawHBar(canvasId, entries, color) {
    const ctx = document.getElementById(canvasId); if (!ctx) return;
    if (charts[canvasId]) charts[canvasId].destroy();
    if (!entries.length) { ctx.getContext("2d").font = "13px sans-serif"; ctx.getContext("2d").fillText("No data yet", 10, 20); return; }
    charts[canvasId] = new Chart(ctx, {
      type:"bar", data:{ labels: entries.map(e=>e[0]), datasets:[{ data: entries.map(e=>e[1]), backgroundColor: color }] },
      options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} }
    });
  }

  return { render, openCase };
})();

        function drawActions() {

          el.querySelectorAll("[data-rmoa]").forEach(b => b.addEventListener("click", () => { v._actions.splice(b.dataset.rmoa,1); drawActions(); }));
        }
        el.querySelector("#op_action_add").addEventListener("click", () => {

          if (val) { v._actions.push(val); el.querySelector("#op_action_input").value=""; drawActions(); }
        });
        drawActions();

        el.querySelector("[data-save]").addEventListener("click", () => {
          const rec = DB.insert("opd_visits", {
            consultation_date: el.querySelector("#op_date").value,
            gender: el.querySelector("#op_gender").value,
            patient_id: el.querySelector("#op_patient").value,
            registration_status: el.querySelector("#op_regstatus").value,

      `,
      footerHtml: `${requireAdmin()?`<button class="btn btn-danger" data-delete>Delete</button>`:""}<button class="btn btn-outline" data-close>Close</button>`,
      onMount: (el) => el.querySelector("[data-delete]")?.addEventListener("click", () => { if (confirm("Delete this OPD record?")) { DB.remove("opd_visits", v.id, currentUser()); el.remove(); route(); } })
    });
  }

  function renderSummary(host) {
    const visits = DB.all("opd_visits");
    const reg = { Registered:0, "Not-Registered":0, New:0, Old:0 };
    visits.forEach(v => { if (reg[v.registration_status]!==undefined) reg[v.registration_status]++; });
    const obCount = visits.filter(v=>v.case_type==="OB").length;
    const gyneCount = visits.filter(v=>v.case_type==="GYNE").length;
    const reasonCounts = {};
    visits.forEach(v => { [...(v.ob_reasons||[]), ...(v.gyne_reasons||[])].forEach(r => { if (r) reasonCounts[r] = (reasonCounts[r]||0)+1; }); });
    const topReasons = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);

    host.innerHTML = `
      <div class="card mt-16">
        <div class="section-title">OPD Data Summary</div>
        <div class="grid cols-4 mb-16">
          <div class="stat-card accent-olive"><div class="stat-label">Total Outpatients</div><div class="stat-value">${visits.length}</div></div>
          <div class="stat-card accent-teal"><div class="stat-label">Total OB</div><div class="stat-value">${obCount}</div></div>
          <div class="stat-card accent-amber"><div class="stat-label">Total GYNE</div><div class="stat-value">${gyneCount}</div></div>
          <div class="stat-card accent-red"><div class="stat-label">Registered / New</div><div class="stat-value">${reg.Registered} / ${reg.New}</div></div>
        </div>
        <div class="grid cols-2">
          <div class="card"><div class="section-title" style="font-size:13px;">Registration Breakdown</div><div class="chart-box small"><canvas id="opdRegChart"></canvas></div></div>
          <div class="card"><div class="section-title" style="font-size:13px;">Top 10 Cause of OPD Consult</div><div class="chart-box small"><canvas id="opdReasonChart"></canvas></div></div>
        </div>
      </div>`;
    const ctx1 = document.getElementById("opdRegChart");
    if (charts.opdReg) charts.opdReg.destroy();
    charts.opdReg = new Chart(ctx1, { type:"bar", data:{ labels:Object.keys(reg), datasets:[{data:Object.values(reg), backgroundColor:"#12796f"}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}} });
    const ctx2 = document.getElementById("opdReasonChart");
    if (charts.opdReason) charts.opdReason.destroy();
    charts.opdReason = new Chart(ctx2, { type:"bar", data:{ labels: topReasons.map(r=>r[0]), datasets:[{data:topReasons.map(r=>r[1]), backgroundColor:"#455a28"}]}, options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}} });
  }

  return { render };
})();
