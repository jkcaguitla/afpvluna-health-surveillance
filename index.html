// ==== js/modules/tasks.js ====
/** modules/tasks.js — Tasks Module
 * Each task: { module, title, assigned_user_id, due_date, status, actions: [{date, actor, note}] }
 * status: "open" (assigned, not yet acknowledged) -> "acknowledged" (in-process) -> "done" (completed)
 */
const ModuleTasks = (() => {
  function statusLabel(s) { return { open:"Open", acknowledged:"In-Process", done:"Completed" }[s] || s; }
  function statusBadge(s) { return `<span class="badge st-${s}">${statusLabel(s)}</span>`; }
  function userName(id) { const u = DB.get("users", id); return u ? `${u.rank||""} ${u.first_name} ${u.last_name}`.trim() : "Unassigned"; }

  function render(container) {
    const tasks = DB.all("tasks").sort((a,b)=> {
      const order = { open:0, acknowledged:1, done:2 };
      return (order[a.status] ?? 0) - (order[b.status] ?? 0) || new Date(b.created_at) - new Date(a.created_at);
    });
    const open = tasks.filter(t=>t.status==="open").length;
    const inProcess = tasks.filter(t=>t.status==="acknowledged").length;
    const done = tasks.filter(t=>t.status==="done").length;

    container.innerHTML = `
      <div class="grid cols-3 mb-16">
        <div class="stat-card accent-amber"><div class="stat-label">Open (Unacknowledged)</div><div class="stat-value">${open}</div></div>
        <div class="stat-card accent-teal"><div class="stat-label">In-Process</div><div class="stat-value">${inProcess}</div></div>
        <div class="stat-card accent-olive"><div class="stat-label">Completed</div><div class="stat-value">${done}</div></div>
      </div>
      <div class="card">
        <div class="flex-between mb-12">
          <div class="section-title" style="margin:0;">Tasks</div>
          <button class="btn btn-primary btn-sm" id="addTaskBtn">+ New Task</button>
        </div>
        <div id="taskTableWrap"></div>
      </div>`;

    document.getElementById("addTaskBtn").addEventListener("click", openNewTaskForm);

    const wrap = document.getElementById("taskTableWrap");
    if (!tasks.length) { wrap.innerHTML = `<div class="empty-state">No tasks yet.</div>`; return; }
    wrap.innerHTML = `
      <table class="data-table">
        <thead><tr><th>Status</th><th>Task</th><th>Module</th><th>Assigned To</th><th>Due</th></tr></thead>
        <tbody>${tasks.map(t=>`
          <tr data-id="${t.id}">
            <td>${statusBadge(t.status||"open")}</td>
            <td style="${t.status==='done'?'text-decoration:line-through;color:var(--ink-400);':''}">${esc(t.title)}</td>
            <td>${esc(t.module)}</td>
            <td>${esc(userName(t.assigned_user_id))}</td>
            <td>${t.due_date ? esc(fmtPHDate(t.due_date)) : "-"}</td>
          </tr>`).join("")}</tbody>
      </table>`;
    wrap.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => openTaskDetail(tr.dataset.id)));
  }

  function openNewTaskForm() {
    openModal({
      title: "New Task",
      bodyHtml: `
        <div class="form-grid">
          <div class="field span-3"><label>Task</label><input id="t_title" placeholder="What needs to be done"></div>
          <div class="field"><label>Module</label><select id="t_module">${NAV_ITEMS.map(n=>`<option>${n.label}</option>`).join("")}</select></div>
          <div class="field span-2"><label>Assign to User</label><select id="t_user">${DB.all("users").filter(u=>u.status==="approved").map(u=>`<option value="${u.id}">${esc(u.rank||"")} ${esc(u.first_name)} ${esc(u.last_name)} — ${esc(u.user_level)}</option>`).join("")}</select></div>
          <div class="field"><label>Due Date</label><input type="date" id="t_due"></div>
        </div>`,
      footerHtml: `<button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-save>Assign Task</button>`,
      onMount: (el) => el.querySelector("[data-save]").addEventListener("click", () => {
        const title = el.querySelector("#t_title").value.trim();
        if (!title) { toast("Task needs a title."); return; }
        DB.insert("tasks", {
          title,
          module: el.querySelector("#t_module").value,
          assigned_user_id: el.querySelector("#t_user").value,
          due_date: el.querySelector("#t_due").value,
          status: "open",
          actions: []
        }, currentUser());
        toast("Task assigned."); el.remove(); route();
      })
    });
  }

  function openTaskDetail(id) {
    const t = DB.get("tasks", id);
    if (!t) return;
    const canManage = requireAdmin() || (currentUser() && currentUser().id === t.assigned_user_id);

    const modal = openModal({
      title: t.title,
      bodyHtml: `
        <div class="grid cols-2 mb-16">
          <div><div class="muted">Module</div><div>${esc(t.module)}</div>
          <div class="muted mt-8">Assigned To</div><div>${esc(userName(t.assigned_user_id))}</div></div>
          <div><div class="muted">Status</div><div>${statusBadge(t.status||"open")}</div>
          <div class="muted mt-8">Due Date</div><div>${t.due_date ? esc(fmtPHDate(t.due_date)) : "No due date"}</div></div>
        </div>
        <div class="section-title">Actions / Progress Notes</div>
        <div class="task-actions-log" id="taskActionsLog"></div>
        <div class="picker-row">
          <input id="taskActionNote" placeholder="Describe what was done / update..." style="flex:1 1 220px; padding:8px 10px; border:1px solid var(--border); border-radius:7px;">
          <button class="btn btn-secondary btn-sm" id="taskActionAdd" type="button">+ Add Action</button>
        </div>
      `,
      footerHtml: `
        ${canManage && (t.status||"open")==="open" ? `<button class="btn btn-secondary" data-ack>Acknowledge</button>` : ""}
        ${canManage && t.status!=="done" ? `<button class="btn btn-primary" data-complete>Mark Complete</button>` : ""}
        ${requireAdmin() ? `<button class="btn btn-danger" data-delete>Delete</button>` : ""}
        <button class="btn btn-outline" data-close>Close</button>`,
      onMount: (el) => {
        function drawLog() {
          const cur = DB.get("tasks", t.id);
          const log = el.querySelector("#taskActionsLog");
          log.innerHTML = (cur.actions && cur.actions.length)
            ? cur.actions.slice().reverse().map(a => `<div class="entry"><div class="when">${fmtPH(a.date)} — ${esc(a.actor)}</div><div>${esc(a.note)}</div></div>`).join("")
            : `<div class="muted" style="font-size:12.5px;">No actions logged yet.</div>`;
        }
        drawLog();

        el.querySelector("#taskActionAdd").addEventListener("click", () => {
          const note = el.querySelector("#taskActionNote").value.trim();
          if (!note) return;
          const cur = DB.get("tasks", t.id);
          const actor = currentUser();
          const actions = [...(cur.actions||[]), { date: nowISO(), actor: `${actor.first_name} ${actor.last_name}`, note }];
          DB.update("tasks", t.id, { actions }, actor);
          el.querySelector("#taskActionNote").value = "";
          drawLog();
        });

        el.querySelector("[data-ack]")?.addEventListener("click", () => {
          DB.update("tasks", t.id, { status: "acknowledged" }, currentUser());
          toast("Task acknowledged — marked in-process.");
          el.remove(); route();
        });
        el.querySelector("[data-complete]")?.addEventListener("click", () => {
          DB.update("tasks", t.id, { status: "done" }, currentUser());
          toast("Task marked complete.");
          el.remove(); route();
        });
        el.querySelector("[data-delete]")?.addEventListener("click", () => {
          if (confirm("Delete this task?")) { DB.remove("tasks", t.id, currentUser()); el.remove(); route(); }
        });
      }
    });
  }

  return { render };
})();

/** modules/directory.js — Directory Module */
const ModuleDirectory = (() => {
  function render(container) {
    const contacts = DB.all("directory").sort((a,b)=>a.last_name.localeCompare(b.last_name));
    const syncedCount = contacts.filter(c => c.user_id).length;
    container.innerHTML = `
      <div class="card">
        <div class="flex-between mb-12">
          <div class="section-title" style="margin:0;">Directory <span class="tag">${contacts.length} contacts</span></div>
          <button class="btn btn-primary btn-sm" id="addContactBtn">+ Add New Contact</button>
        </div>
        <p class="muted mb-12">${syncedCount} of these are registered system users, synced automatically from the Users module. The rest are manually-added contacts (e.g. outside referrals, emergency contacts).</p>
        <div id="dirTableWrap"></div>
      </div>`;

    document.getElementById("addContactBtn").addEventListener("click", () => openContactForm());

    const wrap = document.getElementById("dirTableWrap");
    if (!contacts.length) { wrap.innerHTML = `<div class="empty-state">No contacts yet.</div>`; return; }
    wrap.innerHTML = `
      <table class="data-table">
        <thead><tr><th></th><th>Rank</th><th>Last Name</th><th>First</th><th>Middle</th><th>Department</th><th>Designation</th><th>Contact</th><th>Email</th><th></th></tr></thead>
        <tbody>${contacts.map(c=>`
          <tr data-id="${c.id}">
            <td>${c.gender==="Female"?"&#9792;":"&#9794;"}</td>
            <td>${esc(c.rank||"")}</td><td>${esc(c.last_name)}</td><td>${esc(c.first_name)}</td><td>${esc(c.middle_name||"")}</td>
            <td>${esc(c.department||"")}</td><td>${esc(c.designation||"")}</td>
            <td><a href="tel:${esc(c.contact_number)}" onclick="event.stopPropagation()">${esc(c.contact_number||"")}</a></td>
            <td><a href="mailto:${esc(c.email)}" onclick="event.stopPropagation()">${esc(c.email||"")}</a></td>
            <td>${c.user_id ? `<span class="dir-sync-tag">&#128274; System User</span>` : ""}</td>
          </tr>`).join("")}</tbody>
      </table>`;
    wrap.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => openProfile(tr.dataset.id)));
  }

  function openContactForm(existing) {
    const c = existing || {};
    const locked = !!c.user_id; // identity fields are managed from Users when this entry is synced
    const dis = locked ? "disabled" : "";
    openModal({
      title: existing ? (locked ? "Edit Contact (synced from Users)" : "Edit Contact") : "Add New Contact",
      bodyHtml: `
        ${locked ? `<p class="muted mb-12">&#128274; Name, rank, department, and designation are managed from the Users module for this entry. You can still update contact info and emergency contact here.</p>` : ""}
        <div class="form-grid">
          <div class="field"><label>Last Name</label><input id="c_ln" value="${esc(c.last_name||"")}" ${dis}></div>
          <div class="field"><label>First Name</label><input id="c_fn" value="${esc(c.first_name||"")}" ${dis}></div>
          <div class="field"><label>Middle Name</label><input id="c_mn" value="${esc(c.middle_name||"")}" ${dis}></div>
          <div class="field"><label>Gender</label><select id="c_gender" ${dis}><option>Female</option><option>Male</option></select></div>
          <div class="field"><label>Rank</label><select id="c_rank" ${dis}>${legendOptions("rank")}</select></div>
          <div class="field span-2"><label>Department</label><select id="c_dept" ${dis}>${legendOptions("department")}</select></div>
          <div class="field"><label>Contact Number</label><input id="c_contact" value="${esc(c.contact_number||"")}"></div>
          <div class="field span-2"><label>Email</label><input id="c_email" value="${esc(c.email||"")}"></div>
          <div class="field span-3"><label>Address</label><input id="c_addr" value="${esc(c.address||"")}"></div>
          <div class="field"><label>Birthdate</label><input type="date" id="c_bd" value="${esc(c.birthdate||"")}" ${dis}></div>
          <div class="field"><label>Designation</label><select id="c_desig" ${dis}>${legendOptions("designation")}</select></div>
          <div class="field"><label>+New Designation</label><input id="c_new_desig" placeholder="If not in the list..." ${dis}></div>
          <div class="field"><label>Emergency Contact Name</label><input id="c_ec_name" value="${esc(c.emergency_contact_name||"")}"></div>
          <div class="field"><label>Emergency Contact Number</label><input id="c_ec_num" value="${esc(c.emergency_contact_number||"")}"></div>
        </div>`,
      footerHtml: `<button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button>`,
      onMount: (el) => {
        if (c.rank) el.querySelector("#c_rank").value = c.rank;
        if (c.department) el.querySelector("#c_dept").value = c.department;
        if (c.designation) el.querySelector("#c_desig").value = c.designation;
        el.querySelector("[data-save]").addEventListener("click", () => {
          let desig = el.querySelector("#c_desig").value;
          const newDesig = el.querySelector("#c_new_desig").value.trim();
          if (newDesig) {
            const row = DB.query("legends", r=>r.category==="designation")[0];
            if (row) DB.update("legends", row.id, { data:[...row.data, newDesig] }, currentUser());
            desig = newDesig;
          }
          const payload = {
            last_name: el.querySelector("#c_ln").value, first_name: el.querySelector("#c_fn").value,
            middle_name: el.querySelector("#c_mn").value, gender: el.querySelector("#c_gender").value,
            rank: el.querySelector("#c_rank").value, department: el.querySelector("#c_dept").value,
            contact_number: el.querySelector("#c_contact").value, email: el.querySelector("#c_email").value,
            address: el.querySelector("#c_addr").value, birthdate: el.querySelector("#c_bd").value,
            designation: desig, emergency_contact_name: el.querySelector("#c_ec_name").value,
            emergency_contact_number: el.querySelector("#c_ec_num").value
          };
          if (existing) DB.update("directory", existing.id, payload, currentUser());
          else DB.insert("directory", payload, currentUser());
          toast("Contact saved."); el.remove(); route();
        });
      }
    });
  }

  function openProfile(id) {
    const c = DB.get("directory", id);
    if (!c) return;
    const isSynced = !!c.user_id;
    openModal({
      title: `${esc(c.rank||"")} ${esc(c.last_name)}, ${esc(c.first_name)}`,
      bodyHtml: `
        ${isSynced ? `<p class="muted mb-12">&#128274; This entry is synced from the Users module and stays in sync automatically when that account's profile is edited there.</p>` : ""}
        <div class="grid cols-2">
          <div><div class="muted">Department / Designation</div><div>${esc(c.department||"-")} — ${esc(c.designation||"-")}</div>
          <div class="muted mt-8">Birthdate / Age</div><div>${esc(fmtPHDate(c.birthdate))} (${computeAge(c.birthdate)})</div></div>
          <div><div class="muted">Contact / Email</div><div>${esc(c.contact_number||"-")} / ${esc(c.email||"-")}</div>
          <div class="muted mt-8">Emergency Contact</div><div>${esc(c.emergency_contact_name||"-")} — ${esc(c.emergency_contact_number||"-")}</div></div>
        </div>`,
      footerHtml: `
        ${isSynced ? "" : `<button class="btn btn-danger" data-delete>Delete</button>`}
        <button class="btn btn-secondary" data-edit>${isSynced ? "Edit emergency contact info" : "Edit"}</button>
        <button class="btn btn-outline" data-close>Close</button>`,
      onMount: (el) => {
        el.querySelector("[data-delete]")?.addEventListener("click", () => { if (confirm("Delete this contact?")) { DB.remove("directory", c.id, currentUser()); el.remove(); route(); } });
        el.querySelector("[data-edit]").addEventListener("click", () => { el.remove(); openContactForm(c); });
      }
    });
  }

  return { render };
})();


// ==== js/modules/activityLogs.js ====
/** modules/activityLogs.js — Activity Logs Module */
const ModuleActivity = (() => {
  let filters = { module:"", user:"", search:"", from:"", to:"", today:false };

  function render(container) {
    const all = DB.all("activity_logs");
    const todayCount = all.filter(a => fmtPHDate(a.created_at) === fmtPHDate(nowISO())).length;
    const byDay = {};
    all.forEach(a => { const d = fmtPHDate(a.created_at); byDay[d] = (byDay[d]||0)+1; });
    const avgDaily = Object.keys(byDay).length ? (all.length / Object.keys(byDay).length).toFixed(1) : 0;

    container.innerHTML = `
      <div class="grid cols-4 mb-16">
        <div class="stat-card accent-olive"><div class="stat-label">Total Activities</div><div class="stat-value">${all.length}</div></div>
        <div class="stat-card accent-teal"><div class="stat-label">Today</div><div class="stat-value">${todayCount}</div></div>
        <div class="stat-card accent-amber"><div class="stat-label">Avg / Day (all-time)</div><div class="stat-value">${avgDaily}</div></div>
        <div class="stat-card accent-red"><div class="stat-label">Distinct Modules</div><div class="stat-value">${new Set(all.map(a=>a.module)).size}</div></div>
      </div>
      <div class="card">
        <div class="section-title">Activity Logs</div>
        <div class="grid cols-4 mb-12">
          <input type="text" id="fSearch" placeholder="Search activity..." style="padding:8px; border:1px solid var(--border); border-radius:7px;">
          <select id="fModule" style="padding:8px; border:1px solid var(--border); border-radius:7px;"><option value="">All Modules</option>${[...new Set(all.map(a=>a.module))].map(m=>`<option>${esc(m)}</option>`).join("")}</select>
          <select id="fUser" style="padding:8px; border:1px solid var(--border); border-radius:7px;"><option value="">All Users</option>${[...new Set(all.map(a=>a.actor_name))].map(u=>`<option>${esc(u)}</option>`).join("")}</select>
          <button class="btn btn-secondary" id="todayBtn">Today Only</button>
        </div>
        <div class="grid cols-2 mb-12">
          <input type="date" id="fFrom" style="padding:8px; border:1px solid var(--border); border-radius:7px;">
          <input type="date" id="fTo" style="padding:8px; border:1px solid var(--border); border-radius:7px;">
        </div>
        <div id="logsTableWrap"></div>
      </div>`;

    ["fSearch","fModule","fUser","fFrom","fTo"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => { pull(); draw(); });
      document.getElementById(id).addEventListener("change", () => { pull(); draw(); });
    });
    document.getElementById("todayBtn").addEventListener("click", () => { filters.today = !filters.today; draw(); });

    function pull() {
      filters.search = document.getElementById("fSearch").value.toLowerCase();
      filters.module = document.getElementById("fModule").value;
      filters.user = document.getElementById("fUser").value;
      filters.from = document.getElementById("fFrom").value;
      filters.to = document.getElementById("fTo").value;
    }

    function draw() {
      let list = DB.all("activity_logs").sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
      list = list.filter(a => {
        if (filters.today && fmtPHDate(a.created_at) !== fmtPHDate(nowISO())) return false;
        if (filters.module && a.module !== filters.module) return false;
        if (filters.user && a.actor_name !== filters.user) return false;
        if (filters.search && !`${a.module} ${a.action} ${a.actor_name}`.toLowerCase().includes(filters.search)) return false;
        if (filters.from && new Date(a.created_at) < new Date(filters.from)) return false;
        if (filters.to && new Date(a.created_at) > new Date(filters.to+"T23:59:59")) return false;
        return true;
      }).slice(0, 300);

      const wrap = document.getElementById("logsTableWrap");
      if (!list.length) { wrap.innerHTML = `<div class="empty-state">No activity found.</div>`; return; }
      const moduleColor = { "users":"#0e5f5c","patients":"#455a28","cases":"#8a1f1f","opd_visits":"#a5680f","directory":"#5a7332","tasks":"#12796f","legends":"#616161" };
      wrap.innerHTML = `
        <table class="data-table">
          <thead><tr><th>When</th><th>Module</th><th>Actor</th><th>Action</th><th>Record</th></tr></thead>
          <tbody>${list.map(a=>`
            <tr data-id="${a.id}">
              <td>${fmtPH(a.created_at)}</td>
              <td><span class="badge" style="background:${moduleColor[a.module]||'#7b8270'}">${esc(a.module)}</span></td>
              <td>${esc(a.actor_name)}</td><td>${esc(a.action)}</td>
              <td class="muted">${esc((a.record_id||"").slice(0,8))}...</td>
            </tr>`).join("")}</tbody>
        </table>`;
      wrap.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => openDetail(tr.dataset.id)));
    }
    draw();
  }

  function openDetail(id) {
    const a = DB.get("activity_logs", id);
    if (!a) return;
    openModal({
      title: `${esc(a.module)} — ${esc(a.action)}`,
      bodyHtml: `
        <div class="muted">When</div><div class="mb-8">${fmtPH(a.created_at)}</div>
        <div class="muted">Actor</div><div class="mb-8">${esc(a.actor_name)}</div>
        ${a.before ? `<div class="muted">Before</div><pre style="white-space:pre-wrap; font-size:11px;">${esc(a.before)}</pre>` : ""}
        ${a.after ? `<div class="muted">After</div><pre style="white-space:pre-wrap; font-size:11px;">${esc(a.after)}</pre>` : ""}
      `,
      footerHtml: `<button class="btn btn-outline" data-close>Close</button>`
    });
  }

  return { render };
})();

/** modules/legends.js — Legends Module: add/edit/delete every dropdown definition */
const ModuleLegends = (() => {
  const LABELS = {
    rank: "Rank", bos: "BOS (Branch of Service)", patientCategory: "PC (Patient Category)",
    userLevel: "User Level", caseType: "Case Type", department: "Department", designation: "Designation",
    obgynAdmissionReason: "OB-GYN Admission Reason", evacFrom: "EVAC From", obgynProcedures: "OB-GYN Procedures",
    indicationPrimaryCS: "Indication for Primary CS", dischargeStatus: "Discharge Status",
    obReason: "OB Reason", gyneReason: "GYNE Reason", obOpdProcedures: "OB OPD Procedures",
    familyPlanning: "Family Planning", registrationStatus: "Registration Status"
  };

  function render(container) {
    container.innerHTML = `
      ${taskWidget("Legends")}
      <div class="card">
        <div class="section-title">Legends <span class="tag">Definitions Database</span></div>
        <p class="muted">Every dropdown across the system reads from here, so new entries you add (or that staff add inline with "+ Not in the list") appear everywhere immediately — no code changes needed.</p>
        <div id="legendGroups"></div>
      </div>
      <div id="activityStripHost"></div>
    `;
    document.getElementById("activityStripHost").appendChild(recentActivityStrip("Legends"));

    const host = document.getElementById("legendGroups");
    Object.entries(LABELS).forEach(([key, label]) => {
      const row = DB.query("legends", r => r.category === key)[0];
      if (!row) return;
      const isFlat = Array.isArray(row.data) && (row.data.length === 0 || typeof row.data[0] === "string");
      const card = document.createElement("div");
      card.className = "card mt-12";
      card.innerHTML = `
        <div class="flex-between mb-8">
          <b>${label}</b>
          <div class="flex gap-8">
            <button class="btn btn-secondary btn-sm" data-tpl>&#8681; CSV Template</button>
            <button class="btn btn-secondary btn-sm" data-imp>&#8682; Import CSV</button>
            <input type="file" accept=".csv" style="display:none;" data-file>
            <button class="btn btn-secondary btn-sm" data-pdf>&#8681; PDF</button>
            <button class="btn btn-primary btn-sm" data-add>+ Add</button>
          </div>
        </div>
        <div class="pill-list" data-list></div>`;
      host.appendChild(card);

      function draw() {
        const cur = DB.query("legends", r => r.category === key)[0];
        const list = card.querySelector("[data-list]");
        if (isFlat) {
          list.innerHTML = cur.data.map((v,idx)=>`<span class="pill">${esc(v)} <button data-rm="${idx}">&times;</button></span>`).join("") || `<span class="muted">No entries yet.</span>`;
        } else {
          // grouped (comorbidity) or object-form (patientStatus)
          list.innerHTML = cur.data.map((group, gi) => {
            if (group.group) return `<div class="mb-8" style="width:100%;"><b style="font-size:12px;">${esc(group.group)}</b><div class="pill-list mt-4">${group.items.map((it,idx)=>`<span class="pill">${esc(it)} <button data-rmg="${gi}:${idx}">&times;</button></span>`).join("")}</div></div>`;
            if (group.value) return `<span class="pill" style="background:${group.color};color:#fff;">${esc(group.value)}</span>`;
            return "";
          }).join("");
        }
        list.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
          const d = [...cur.data]; d.splice(b.dataset.rm,1);
          DB.update("legends", cur.id, { data: d }, currentUser()); toast("Entry removed."); draw();
        }));
        list.querySelectorAll("[data-rmg]").forEach(b => b.addEventListener("click", () => {
          const [gi, idx] = b.dataset.rmg.split(":").map(Number);
          const d = JSON.parse(JSON.stringify(cur.data));
          d[gi].items.splice(idx,1);
          DB.update("legends", cur.id, { data: d }, currentUser()); toast("Entry removed."); draw();
        }));
      }
      draw();

      card.querySelector("[data-add]").addEventListener("click", () => {
        openModal({
          title: `Add to ${label}`,
          bodyHtml: isFlat
            ? `<div class="field"><label>${label}</label><input id="newval" placeholder="Type new entry..."></div>`
            : `<div class="field"><label>Group</label><select id="newgroup">${row.data.filter(g=>g.group).map(g=>`<option>${esc(g.group)}</option>`).join("")}</select></div>
               <div class="field mt-8"><label>New item</label><input id="newval"></div>`,
          footerHtml: `<button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-save>Add</button>`,
          onMount: (el) => el.querySelector("[data-save]").addEventListener("click", () => {
            const v = el.querySelector("#newval").value.trim(); if (!v) return;
            const cur = DB.query("legends", r=>r.category===key)[0];
            let d;
            if (isFlat) { d = [...cur.data, v]; }
            else {
              d = JSON.parse(JSON.stringify(cur.data));
              const g = d.find(x => x.group === el.querySelector("#newgroup").value);
              if (g) g.items.push(v);
            }
            DB.update("legends", cur.id, { data: d }, currentUser());
            toast("Entry added."); el.remove(); draw();
          })
        });
      });

      card.querySelector("[data-tpl]").addEventListener("click", () => downloadBlob("value\nExample entry\n", `${key}-template.csv`, "text/csv"));
      card.querySelector("[data-imp]").addEventListener("click", () => card.querySelector("[data-file]").click());
      card.querySelector("[data-file]").addEventListener("change", (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const rows = parseCsv(ev.target.result).map(r => r.value).filter(Boolean);
          const cur = DB.query("legends", r=>r.category===key)[0];
          if (isFlat) DB.update("legends", cur.id, { data: [...cur.data, ...rows] }, currentUser());
          toast(`Imported ${rows.length} entries into ${label}.`); draw();
        };
        reader.readAsText(file); e.target.value = "";
      });
      card.querySelector("[data-pdf]").addEventListener("click", () => {
        const cur = DB.query("legends", r=>r.category===key)[0];
        const doc = new jspdf.jsPDF();
        doc.setFontSize(13); doc.text(`AFP-VLUNA Legends — ${label}`, 14, 16);
        doc.setFontSize(9);
        let y = 26;
        const flatVals = isFlat ? cur.data : cur.data.flatMap(g => g.group ? g.items.map(i=>`${g.group}: ${i}`) : [g.value]);
        flatVals.forEach(v => { doc.text(String(v), 14, y); y += 6; if (y>280) { doc.addPage(); y=16; } });
        doc.save(`legends-${key}.pdf`);
      });
    });
  }

  return { render };
})();

/** modules/overview.js — Overview Module: compiled hospital-wide snapshot */
const ModuleOverview = (() => {
  let charts = {};

  function render(container) {
    const patients = DB.all("patients");
    const cases = DB.all("cases");
    const opd = DB.all("opd_visits");
    const users = DB.all("users");
    const pendingUsers = users.filter(u => u.status === "pending").length;
    const admitted = patients.filter(p => p.status === "Admitted").length;
    const openTasks = DB.query("tasks", t => t.status === "open").length;

    container.innerHTML = `
      <div class="grid cols-4 mb-16">
        ${statCard("Currently Admitted", admitted, "accent-teal", "patients")}
        ${statCard("Total Cases", cases.length, "accent-olive", "cases")}
        ${statCard("Total OPD Visits", opd.length, "accent-amber", "opd")}
        ${statCard("Pending Approvals", pendingUsers, "accent-red", "users")}
      </div>
      <div class="grid cols-2 mb-16">
        <div class="card" data-jump="cases">
          <div class="section-title" style="font-size:13px;">Admissions — OB vs GYNE</div>
          <div class="chart-box small"><canvas id="ovObGyne"></canvas></div>
        </div>
        <div class="card" data-jump="opd">
          <div class="section-title" style="font-size:13px;">OPD Consultations — OB vs GYNE</div>
          <div class="chart-box small"><canvas id="ovOpdSplit"></canvas></div>
        </div>
      </div>
      <div class="grid cols-2 mb-16">
        <div class="card" data-jump="cases">
          <div class="section-title" style="font-size:13px;">Patient Status Breakdown</div>
          <div class="chart-box small"><canvas id="ovStatus"></canvas></div>
        </div>
        <div class="card" data-jump="tasks">
          <div class="section-title" style="font-size:13px;">Open Tasks by Module</div>
          <div class="chart-box small"><canvas id="ovTasks"></canvas></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Quick Jump</div>
        <div class="pill-list">
          ${NAV_ITEMS.filter(n=>n.key!=="overview").map(n=>`<span class="pill" style="cursor:pointer;" data-jump="${n.key}">${n.label}</span>`).join("")}
        </div>
      </div>
      <div class="card mt-16">
        <div class="flex-between mb-8"><b>Open Tasks</b><span class="muted">${openTasks} total</span></div>
        <div class="pill-list">
          ${DB.query("tasks", t=>t.status==="open").slice(0,6).map(t=>`<span class="pill">${esc(t.title)} <span class="muted">(${esc(t.module)})</span></span>`).join("") || `<span class="muted">No open tasks.</span>`}
        </div>
      </div>
    `;

    document.querySelectorAll("[data-jump]").forEach(el => el.addEventListener("click", () => { location.hash = "#/" + el.dataset.jump; }));

    drawBar("ovObGyne", ["OB","GYNE"], [cases.filter(c=>c.case_type==="OB").length, cases.filter(c=>c.case_type==="GYNE").length], "#0e5f5c");
    const opdOb = opd.filter(v=>v.case_type==="OB").length, opdGyne = opd.filter(v=>v.case_type==="GYNE").length;
    drawBar("ovOpdSplit", ["OB","GYNE"], [opdOb, opdGyne], "#a5680f");
    const statuses = ["Admitted","Discharged","Deceased","Non-Admitted"];
    drawBar("ovStatus", statuses, statuses.map(s=>patients.filter(p=>p.status===s).length), "#455a28");
    const moduleNames = [...new Set(DB.query("tasks", t=>t.status==="open").map(t=>t.module))];
    drawBar("ovTasks", moduleNames, moduleNames.map(m=>DB.query("tasks", t=>t.status==="open"&&t.module===m).length), "#8a1f1f");
  }

  function statCard(label, value, accent, jump) {
    return `<div class="stat-card ${accent}" style="cursor:pointer;" data-jump="${jump}"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
  }
  function drawBar(canvasId, labels, data, color) {
    const ctx = document.getElementById(canvasId); if (!ctx) return;
    if (charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart(ctx, { type:"bar", data:{ labels, datasets:[{ data, backgroundColor: color }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } });
  }

  return { render };
})();

/**
 * app.js — shell, hash router, sidebar, topbar, shared UI helpers.
 * Each feature module (js/modules/*.js) exposes a `render(container)`

 * file only wires navigation + auth guard; it holds no feature logic,
 * which is what keeps each module independently editable per the brief
 * ("codes should be separated based on its tab").
 */

const NAV_ITEMS = [
  { key: "overview",   label: "Overview",       icon: "&#9673;", mod: () => ModuleOverview },
  { key: "patients",   label: "Patient Record", icon: "&#128100;", mod: () => ModulePatients },
  { key: "cases",      label: "Cases",          icon: "&#127973;", mod: () => ModuleCases },
  { key: "opd",        label: "OPD",            icon: "&#128203;", mod: () => ModuleOPD },
  { key: "wards",      label: "Wards",          icon: "&#128722;", mod: () => ModuleWards },
  { key: "tasks",      label: "Tasks",          icon: "&#9989;",  mod: () => ModuleTasks },
  { key: "directory",  label: "Directory",      icon: "&#128218;", mod: () => ModuleDirectory },
  { key: "users",      label: "Users",          icon: "&#128101;", mod: () => ModuleUsers },
  { key: "activity",   label: "Activity Logs",  icon: "&#128337;", mod: () => ModuleActivity },
  { key: "legends",    label: "Legends",        icon: "&#128220;", mod: () => ModuleLegends }
];

function currentUser() { return DB.getSession(); }

function requireAdmin() {
  const u = currentUser();
  return u && u.user_level === "Admin";
}
function requireApprover() {
  const u = currentUser();
  return u && (u.user_level === "Admin" || u.user_level === "Chief Resident");
}

function initials(u) {
  if (!u) return "?";
  return `${(u.first_name || "?")[0]}${(u.last_name || "?")[0]}`.toUpperCase();
}

function toast(msg) {
  let wrap = document.querySelector(".toast-wrap");
  if (!wrap) {
    wrap = document.createElement("div");
    wrap.className = "toast-wrap";
    document.body.appendChild(wrap);
  }
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openModal({ title, bodyHtml, footerHtml, onMount }) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${title}</h3>
        <button class="close-x" data-close>&times;</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ""}
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop || e.target.hasAttribute("data-close")) backdrop.remove();
  });
  if (onMount) onMount(backdrop);
  return backdrop;
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

function statusBadgeClass(status) {
  const map = { "Admitted":"st-admitted","Discharged":"st-discharged","Deceased":"st-deceased","Non-Admitted":"st-nonadmitted" };
  return map[status] || "neutral";
}

function legendList(category) {
  const row = DB.query("legends", r => r.category === category)[0];
  return row ? row.data : [];
}
function legendOptions(category, valueKey) {
  const list = legendList(category);
  return list.map(item => {
    const v = valueKey ? item[valueKey] : item;
    const label = typeof v === "object" ? JSON.stringify(v) : v;
    return `<option value="${esc(label)}">${esc(label)}</option>`;
  }).join("");
}

function taskWidget(moduleName) {
  const tasks = DB.query("tasks", t => t.module === moduleName && t.status !== "done");
  if (tasks.length === 0) return "";
  return `
    <details class="task-drawer">
      <summary>&#128204; ${tasks.length} open task${tasks.length>1?"s":""} for ${esc(moduleName)}</summary>
      <ul style="margin:10px 0 0; padding-left:18px;">
        ${tasks.map(t => {
          const u = DB.get("users", t.assigned_user_id);
          const who = u ? `${u.first_name} ${u.last_name}` : "Unassigned";
          return `<li style="margin-bottom:4px; font-size:13px;">${esc(t.title)} <span class="muted">— ${esc(who)} (${esc(t.status === "acknowledged" ? "In-Process" : "Open")})</span></li>`;
        }).join("")}
      </ul>
    </details>`;
}

function recentActivityStrip(moduleName, days = 3) {
  const cutoff = Date.now() - days * 86400000;
  const rows = DB.query("activity_logs", r => r.module === moduleName && new Date(r.created_at).getTime() >= cutoff)
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  const pageSize = 5;
  let page = 0;

  const box = document.createElement("div");
  box.className = "card mt-16";

  function draw() {
    const slice = rows.slice(page*pageSize, page*pageSize+pageSize);
    box.innerHTML = `
      <div class="section-title">Recent Activity <span class="tag">Last ${days} days</span></div>
      ${slice.length === 0 ? `<div class="muted">No recent activity.</div>` : `
      <table class="data-table">
        <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Record</th></tr></thead>
        <tbody>
          ${slice.map(r => `<tr><td>${fmtPH(r.created_at)}</td><td>${esc(r.actor_name)}</td><td>${esc(r.action)}</td><td class="muted">${esc(r.record_id).slice(0,8)}...</td></tr>`).join("")}
        </tbody>
      </table>`}
      <div class="pager">
        <button data-prev ${page===0?"disabled":""}>&#8592; Prev</button>
        <span class="muted">Page ${page+1} of ${Math.max(1, Math.ceil(rows.length/pageSize))}</span>
        <button data-next ${((page+1)*pageSize>=rows.length)?"disabled":""}>Next &#8594;</button>
      </div>`;
    box.querySelector("[data-prev]")?.addEventListener("click", () => { page--; draw(); });
    box.querySelector("[data-next]")?.addEventListener("click", () => { page++; draw(); });
  }
  draw();
  return box;
}

  document.getElementById("mobileNavToggle").addEventListener("click", openMobileNav);
  scrim.addEventListener("click", closeMobileNav);
  document.getElementById("navList").addEventListener("click", closeMobileNav);
}

function setActiveNav(key) {
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.key === key));
  const item = NAV_ITEMS.find(i => i.key === key);
  const title = document.getElementById("viewTitle");
  if (title) title.textContent = item ? item.label : "";
}

function route() {
  const user = currentUser();
  if (!user) { ModuleLogin.render(document.getElementById("root")); return; }
  if (user.status !== "approved") { ModuleLogin.renderPendingScreen(document.getElementById("root")); return; }

  if (!document.getElementById("app-shell")) renderShell();

  let hash = location.hash.replace("#/", "") || "overview";
  const item = NAV_ITEMS.find(i => i.key === hash);
  if (!item) { location.hash = "#/overview"; return; }

  setActiveNav(hash);
  const container = document.getElementById("viewContainer");
  container.innerHTML = "";
  item.mod().render(container);
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", async () => {
  DB.seedIfEmpty();
  // In supabase mode, Supabase's own client persists the auth token across
  // reloads — this re-hydrates our app-level session cache from it so the
  // rest of the app (which reads DB.getSession() synchronously) keeps
  // working unchanged. In local mode this is a no-op.
  if (APP_CONFIG.DB_MODE === "supabase") {
    try {
      const profile = await DB.auth.restoreSession();
      if (profile) DB.setSession(profile);
    } catch (e) {
      console.warn("Could not restore Supabase session:", e);
    }
  }
  route();
});

async function logoutUser() {
  if (APP_CONFIG.DB_MODE === "supabase") {
    try { await DB.auth.signOut(); } catch (e) { console.warn("Supabase sign-out failed:", e); }
  }
  DB.clearSession();
  location.hash = "";
  document.getElementById("root").innerHTML = "";
  route();
}

</script>
</body>
</html>
